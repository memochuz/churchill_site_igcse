#-------------------------------
# General Site Settings
baseurl: "/churchill_site_igcse"  # the subpath of your site, e.g. /blog
url: "https://memochuz.github.io/" # the base hostname & protocol for your site, e.g. http://example.com

github:
  owner_name: memochuz
  repository_name: churchill_site_igcse


#-------------------------------
# Build Settings
markdown: kramdown
permalink: /:title
plugins:
  - jekyll-paginate
  - jekyll-sitemap

paginate: 4
paginate_path: "/blog/page/:num"


#-------------------------------
# Collections
collections:
  pages:
    output: true
    permalink: /:name
  posts:
    output: true
    permalink: /blog/:slug
  projects:
    output: true
    permalink: /projects/:slug
  videos:
    output: true
    permalink: /videos/:slug
  gallery:
    output: true
    permalink: /gallery/:slug

# Pages Path
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
      type: "videos"
    values:
      layout: "video"
  - scope:
      path: ""
      type: "gallery"
    values:
      layout: "gallery"

sass:
  sass_dir: _sass
  style: compressed

#-------------------------------
