        <p class="highlight-text">Express the final answer in simplest radical form.</p>
      solucion:
        titulo_respuesta: |
          $$2m^2 n^3 \sqrt[4]{3m n^2}$$
        pasos:
          - |
            **Factorize into prime factors and variables:** Prime factorize $48$ and write out variables:

            $$\sqrt[4]{(2 \cdot 2 \cdot 2 \cdot 2 \cdot 3) \cdot m^9 \cdot n^{14}}$$
          - |
            **Group depending on the index ($n = 4$):** Form explicit groups of 4:

            $$\sqrt[4]{(2^4 \cdot 3) \cdot (m^4 \cdot m^4 \cdot m) \cdot (n^4 \cdot n^4 \cdot n^4 \cdot n^2)}$$
          - |
            **Extract and multiply:** Extract one factor for each group of 4 ($2, m, m, n, n, n$) and multiply:

            $$(2 \cdot m \cdot m \cdot n \cdot n \cdot n)\sqrt[4]{3 \cdot m \cdot n^2} = 2m^2 n^3 \sqrt[4]{3m n^2}$$

    - id: 4
      titulo: "Raíz quinta de monomio"
      dificultad: "Easy"
      tema: "Simplification of Surds"
      tiempo_minutos: 3
      enunciado: |
        Simplify the fifth root expression completely:

