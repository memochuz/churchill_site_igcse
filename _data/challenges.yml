      solucion:
        titulo_respuesta: |
          $$19x\sqrt{2x}$$
        pasos:
          - |
            **Factorize and group by index ($n = 2$):**
            * Term 1: $3\sqrt{(2 \cdot 5^2) \cdot (x^2 \cdot x)}$
            * Term 2: $-x\sqrt{(2 \cdot 3^2) \cdot x}$
            * Term 3: $\sqrt{(2 \cdot 7^2) \cdot (x^2 \cdot x)}$
          - |
            **Extract and multiply:**
            * Term 1: $3 \cdot (5 \cdot x)\sqrt{2x} = 15x\sqrt{2x}$
            * Term 2: $-x \cdot (3)\sqrt{2x} = -3x\sqrt{2x}$
            * Term 3: $(7 \cdot x)\sqrt{2x} = 7x\sqrt{2x}$
          - |
            **Remember:** To add or subtract surds, terms **must have the exact same index and radicand** ($\sqrt{2x}$):

            $$(15x - 3x + 7x)\sqrt{2x} = 19x\sqrt{2x}$$

    - id: 6
      titulo: "Suma de raíces cúbicas"
      dificultad: "Medium"
      tema: "Simplification of Surds"
      tiempo_minutos: 4
      enunciado: |
        Simplify each radical term to determine which terms can be combined. Express the final answer in fully simplified form:

        $$2\sqrt[3]{81a^4 b} + a\sqrt[3]{24a b} - \sqrt[3]{375a^4 b}$$

        <p class="highlight-text">Express the final answer in its most simplified form.</p>
      solucion:
        titulo_respuesta: |
          $$3a\sqrt[3]{3ab}$$
        pasos:
          - |
            **Factorize and group by index ($n = 3$):**
            * Term 1: $2\sqrt[3]{(3^3 \cdot 3) \cdot (a^3 \cdot a) \cdot b}$
            * Term 2: $a\sqrt[3]{(2^3 \cdot 3) \cdot a \cdot b}$
            * Term 3: $-\sqrt[3]{(5^3 \cdot 3) \cdot (a^3 \cdot a) \cdot b}$
          - |
            **Extract and multiply:**
            * Term 1: $2 \cdot (3 \cdot a)\sqrt[3]{3ab} = 6a\sqrt[3]{3ab}$
            * Term 2: $a \cdot (2)\sqrt[3]{3ab} = 2a\sqrt[3]{3ab}$
            * Term 3: $-(5 \cdot a)\sqrt[3]{3ab} = -5a\sqrt[3]{3ab}$
          - |
            **Remember:** Combine only terms sharing the **same index ($3$) and radicand ($3ab$)**:

            $$(6a + 2a - 5a)\sqrt[3]{3ab} = 3a\sqrt[3]{3ab}$$

    - id: 7
      titulo: "Radicales multivariable"
      dificultad: "Medium"
      tema: "Simplification of Surds"
      tiempo_minutos: 4
      enunciado: |
        Simplify all radical expressions. Note that some terms may not be like terms and cannot be combined. Write your final answer in simplest radical form:

        $$\sqrt{12x^5 y^2} + 5x^2 \sqrt{3x y^2} - \sqrt{75x^3 y^2}$$

        <p class="highlight-text">Express the final result with positive variable bases.</p>
      solucion:
        titulo_respuesta: |
          $$7x^2 y\sqrt{3x} - 5xy\sqrt{3x}$$
        pasos:
          - |
            **Factorize and group by index ($n = 2$):**
            * Term 1: $\sqrt{(2^2 \cdot 3) \cdot (x^2 \cdot x^2 \cdot x) \cdot y^2}$
            * Term 2: $5x^2 \sqrt{3 \cdot x \cdot y^2}$
            * Term 3: $-\sqrt{(5^2 \cdot 3) \cdot (x^2 \cdot x) \cdot y^2}$
          - |
            **Extract and multiply:**
            * Term 1: $(2 \cdot x \cdot x \cdot y)\sqrt{3x} = 2x^2 y\sqrt{3x}$
            * Term 2: $5x^2 \cdot (y)\sqrt{3x} = 5x^2 y\sqrt{3x}$
            * Term 3: $-(5 \cdot x \cdot y)\sqrt{3x} = -5xy\sqrt{3x}$
          - |
            **Remember:** Check for the **same index and radicand** ($\sqrt{3x}$) AND matching variable coefficients ($x^2 y$ vs $xy$):

            $$(2x^2 y + 5x^2 y)\sqrt{3x} - 5xy\sqrt{3x} = 7x^2 y\sqrt{3x} - 5xy\sqrt{3x}$$

    - id: 8
      titulo: "Índices radicales mixtos"
      dificultad: "Medium"
      tema: "Simplification of Surds"
      tiempo_minutos: 4
      enunciado: |
        Simplify each term fully and combine like terms where possible. Leave un-combinable terms in their simplest radical form:

        $$\sqrt[4]{32x^7} + x\sqrt[4]{162x^3} - \sqrt[3]{16x^4}$$

        <p class="highlight-text">Group matching indices together.</p>
      solucion:
        titulo_respuesta: |
          $$5x\sqrt[4]{2x^3} - 2x\sqrt[3]{2x}$$
        pasos:
          - |
            **Factorize and group by respective indices:**
            * Term 1 ($n=4$): $\sqrt[4]{(2^4 \cdot 2) \cdot (x^4 \cdot x^3)}$
            * Term 2 ($n=4$): $x\sqrt[4]{(3^4 \cdot 2) \cdot x^3}$
            * Term 3 ($n=3$): $-\sqrt[3]{(2^3 \cdot 2) \cdot (x^3 \cdot x)}$
          - |
            **Extract and multiply:**
            * Term 1: $(2 \cdot x)\sqrt[4]{2x^3} = 2x\sqrt[4]{2x^3}$
            * Term 2: $x \cdot (3)\sqrt[4]{2x^3} = 3x\sqrt[4]{2x^3}$
            * Term 3: $-(2 \cdot x)\sqrt[3]{2x} = -2x\sqrt[3]{2x}$
          - |
            **Remember:** We can only combine terms that have the **exact same index and radicand**. Combine the 4th-root terms and leave the 3rd-root term separate:

            $$(2x + 3x)\sqrt[4]{2x^3} - 2x\sqrt[3]{2x} = 5x\sqrt[4]{2x^3} - 2x\sqrt[3]{2x}$$

    # HARD (9-12)
    - id: 9
      titulo: "Geometría: Volumen y área de un cubo"
      dificultad: "Hard"
      tema: "Simplification of Surds"
      tiempo_minutos: 5
      enunciado: |
        A cube has a total volume of $V = 128 \text{ cm}^3$.

        1. Find the exact side length $s = \sqrt[3]{V}$ in simplified surd form $a\sqrt[3]{b}$.
        2. Calculate the total surface area $A = 6s^2$ of the cube in exact simplified surd form.

        <p class="highlight-text">Show all intermediate simplification steps.</p>
      solucion:
        titulo_respuesta: |
          $$s = 4\sqrt[3]{2}\text{ cm}, \quad A = 96\sqrt[3]{4}\text{ cm}^2$$
        pasos:
          - |
            **Factorize into primes and group ($n = 3$):** Express $128 = 2^7$ as groups of 3:

            $$s = \sqrt[3]{2^3 \cdot 2^3 \cdot 2}$$
          - |
            **Extract and multiply:** Pull out one $2$ for each complete group of 3:

            $$s = (2 \cdot 2)\sqrt[3]{2} = 4\sqrt[3]{2}\text{ cm}$$
          - |
            **Calculate surface area $A = 6s^2$:**

            $$s^2 = (4\sqrt[3]{2})^2 = 16\sqrt[3]{2^2} = 16\sqrt[3]{4}$$

            $$A = 6 \cdot (16\sqrt[3]{4}) = 96\sqrt[3]{4}\text{ cm}^2$$

    - id: 10
      titulo: "Geometría: Perímetro de base triangular"
      dificultad: "Hard"
      tema: "Simplification of Surds"
      tiempo_minutos: 5
      enunciado: |
        A right-angled triangular base has three side lengths given by $a = \sqrt{72x^3}$, $b = \sqrt{18x^3}$, and $c = \sqrt{50x^3}$.

        1. Simplify each of the three side lengths $a$, $b$, and $c$.
        2. Calculate the total perimeter $P = a + b + c$ of the triangular base in simplest surd form.

        <p class="highlight-text">Express the final perimeter as a single term.</p>
      solucion:
        titulo_respuesta: |
          $$P = 14x\sqrt{2x}$$
        pasos:
          - |
            **Factorize and group by index ($n = 2$):**
            * $a = \sqrt{(2^2 \cdot 3^2 \cdot 2) \cdot (x^2 \cdot x)}$
            * $b = \sqrt{(3^2 \cdot 2) \cdot (x^2 \cdot x)}$
            * $c = \sqrt{(5^2 \cdot 2) \cdot (x^2 \cdot x)}$
          - |
            **Extract and multiply each side:**
            * $a = (2 \cdot 3 \cdot x)\sqrt{2x} = 6x\sqrt{2x}$
            * $b = (3 \cdot x)\sqrt{2x} = 3x\sqrt{2x}$
            * $c = (5 \cdot x)\sqrt{2x} = 5x\sqrt{2x}$
          - |
            **Remember:** Since all three simplified sides share the **same index ($2$) and radicand ($2x$)**, add their coefficients to find the perimeter $P$:

            $$P = (6x + 3x + 5x)\sqrt{2x} = 14x\sqrt{2x}$$

    - id: 11
      titulo: "Geometría: Área de placa en L"
      dificultad: "Hard"
      tema: "Simplification of Surds"
      tiempo_minutos: 5
      enunciado: |
        An L-shaped geometric plate is composed of two rectangular regions $R_1$ and $R_2$. The area of region $R_1$ is $A_1 = \sqrt{48x^5} \cdot \sqrt{12x}$, and the area of region $R_2$ is $A_2 = \sqrt{27x^3} \cdot \sqrt{3x}$.

        1. Simplify the expressions for areas $A_1$ and $A_2$ completely.
        2. Find the total area $A_{\text{total}} = A_1 + A_2$ of the L-shaped plate.

        <p class="highlight-text">Express the final answer as a simplified polynomial.</p>
      solucion:
        titulo_respuesta: |
          $$A_{\text{total}} = 24x^3 + 9x^2$$
        pasos:
          - |
            **Combine and factorize into explicit groups ($n = 2$):**
            * $A_1 = \sqrt{48x^5 \cdot 12x} = \sqrt{576x^6} = \sqrt{(2^2 \cdot 2^2 \cdot 2^2 \cdot 3^2) \cdot (x^2 \cdot x^2 \cdot x^2)}$
            * $A_2 = \sqrt{27x^3 \cdot 3x} = \sqrt{81x^4} = \sqrt{(3^2 \cdot 3^2) \cdot (x^2 \cdot x^2)}$
          - |
            **Extract and multiply:**
            * $A_1 = 2 \cdot 2 \cdot 2 \cdot 3 \cdot x \cdot x \cdot x = 24x^3$
            * $A_2 = 3 \cdot 3 \cdot x \cdot x = 9x^2$
          - |
            **Calculate total area:** Add regions $A_1$ and $A_2$:

            $$A_{\text{total}} = 24x^3 + 9x^2$$

    - id: 12
      titulo: "Geometría: Dimensiones y volumen de contenedor"
      dificultad: "Hard"
      tema: "Simplification of Surds"
      tiempo_minutos: 5
      enunciado: |
        A closed rectangular container has dimensions $l = \sqrt[3]{16a^4}$, $w = \sqrt[3]{54a^4}$, and $h = \sqrt[3]{128a^4}$.

        1. Express the sum of the three dimensions $S = l + w + h$ in simplest surd form $k a \sqrt[3]{2a}$.
        2. Find the exact volume $V = l \cdot w \cdot h$ of the box.

        <p class="highlight-text">Show all radical simplifications explicitly.</p>
      solucion:
        titulo_respuesta: |
          $$S = 9a\sqrt[3]{2a}, \quad V = 48a^4$$
        pasos:
          - |
            **Factorize into primes and variables (index $n = 3$):**
            * $l = \sqrt[3]{(2^3 \cdot 2) \cdot (a^3 \cdot a)}$
            * $w = \sqrt[3]{(3^3 \cdot 2) \cdot (a^3 \cdot a)}$
            * $h = \sqrt[3]{(2^3 \cdot 2^3 \cdot 2) \cdot (a^3 \cdot a)}$
          - |
            **Extract and multiply each dimension:**
            * $l = 2a\sqrt[3]{2a}$
            * $w = 3a\sqrt[3]{2a}$
            * $h = (2 \cdot 2)a\sqrt[3]{2a} = 4a\sqrt[3]{2a}$
          - |
            **Remember:** Since $l, w, h$ have the **same index ($3$) and radicand ($2a$)**, sum them directly:

            $$S = (2a + 3a + 4a)\sqrt[3]{2a} = 9a\sqrt[3]{2a}$$
          - |
            **Calculate volume $V = l \cdot w \cdot h$:** Combine products under a single cube root and group in sets of 3:

            $$V = \sqrt[3]{(2^4 \cdot a^4)(2 \cdot 3^3 \cdot a^4)(2^7 \cdot a^4)} = \sqrt[3]{(2^3 \cdot 2^3 \cdot 2^3 \cdot 2^3 \cdot 3^3) \cdot (a^3 \cdot a^3 \cdot a^3 \cdot a^3)}$$

            $$V = (2 \cdot 2 \cdot 2 \cdot 2 \cdot 3) \cdot (a \cdot a \cdot a \cdot a) = 48a^4$$
