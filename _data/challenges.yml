- id: "significant_figures"
  titulo_evaluacion: "Significant Figures Challenges"
  topic: "Significant Figures"
  description: "Exercises on counting significant figures, eliminating ambiguity with scientific notation, rounding rules, and performing calculations respecting operational precision."
  preguntas:
    # EASY (1-4)
    - id: 1
      titulo: "Conteo de cifras significativas"
      dificultad: "Easy"
      tema: "Significant Figures"
      tiempo_minutos: 3
      enunciado: |
        Determine the number of significant figures in the following measurement:

        $$0.003050\text{ g}$$

        <p class="highlight-text">Identify the status of leading, captive, and trailing zeros.</p>
      solucion:
        titulo_respuesta: |
          $$4\text{ significant figures}$$
        pasos:
          - |
            **Identify leading zeros:** Zeros to the left of the first non-zero digit ($0.00$) are **never significant**; they act purely as placevalue markers.
          - |
            **Identify non-zero digits and captive zeros:** The digits $3$ and $5$ are non-zero (always significant). The zero sandwiched between them ($3\mathbf{0}5$) is a **captive zero**, which is **always significant**.
          - |
            **Identify trailing zeros:** The zero at the end ($0.00305\mathbf{0}$) is a **trailing zero with a decimal point present**, which makes it **significant** as it reflects instrument precision.
          - |
            **Count total significant digits:** The significant digits are $3, 0, 5, 0$, giving a total of **$4$ significant figures**.

    - id: 2
      titulo: "Eliminación de ambigüedad con notación científica"
      dificultad: "Easy"
      tema: "Significant Figures"
      tiempo_minutos: 3
      enunciado: |
        Express the measurement $450000\text{ m}$ with **exactly $3$ significant figures** using scientific notation.

        <p class="highlight-text">Use scientific notation to isolate precision from magnitude.</p>
      solucion:
        titulo_respuesta: |
          $$4.50 \times 10^5\text{ m}$$
        pasos:
          - |
            **Analyze the original number:** In $450000$, trailing zeros without a explicit decimal point are ambiguous/placeholders, representing only $2$ guaranteed significant figures ($4$ and $5$).
          - |
            **Apply scientific notation format $N \times 10^k$:** Place the decimal point after the first non-zero digit to get a coefficient $N$ between $1$ and $10$:

            $$450000 = 4.5 \times 10^5$$
          - |
            **Adjust precision to 3 significant figures:** Add trailing zeros after the decimal point in the coefficient $N$ until there are 3 digits ($4.50$):

            $$4.50 \times 10^5\text{ m}$$

    - id: 3
      titulo: "Cifras significativas en notación científica"
      dificultad: "Easy"
      tema: "Significant Figures"
      tiempo_minutos: 3
      enunciado: |
        State the number of significant figures in the following measurement:

        $$4.080 \times 10^{-3}\text{ L}$$

        <p class="highlight-text">Apply the golden rule for counting digits in scientific notation.</p>
      solucion:
        titulo_respuesta: |
          $$4\text{ significant figures}$$
        pasos:
          - |
            **Apply the Golden Rule for Scientific Notation:** Ignore the exponential power of ten ($10^{-3}$) completely, as it only specifies magnitude.
          - |
            **Count digits in the coefficient ($4.080$):**
            * Non-zero digits: $4$ and $8$ (2 digits).
            * Captive zero between $4$ and $8$: significant (1 digit).
            * Trailing zero after $8$ with decimal present: significant (1 digit).
          - |
            **Total count:** All digits $4, 0, 8, 0$ count, yielding **$4$ significant figures**.

    - id: 4
      titulo: "Multiplicación básica y redondeo"
      dificultad: "Easy"
      tema: "Significant Figures"
      tiempo_minutos: 3
      enunciado: |
        Calculate the product of the following two measurements and round the final answer to the correct number of significant figures:

        $$14.25\text{ m} \times 3.2\text{ m}$$

        <p class="highlight-text">Express the final area with proper significant figures.</p>
      solucion:
        titulo_respuesta: |
          $$46\text{ m}^2$$
        pasos:
          - |
            **Count sig figs in each factor:**
            * $14.25\text{ m} \implies 4\text{ sig figs}$
            * $3.2\text{ m} \implies 2\text{ sig figs}$
          - |
            **Identify the limiting factor rule:** For multiplication and division, the final result must be rounded to match the **fewest total significant figures** of any input ($2\text{ sig figs}$).
          - |
            **Perform the calculation and round:**

            $$14.25 \times 3.2 = 45.6$$

            Rounding $45.6$ to $2\text{ sig figs}$ gives **$46\text{ m}^2$**.

    # MEDIUM (5-8)
    - id: 5
      titulo: "Suma y precisión decimal"
      dificultad: "Medium"
      tema: "Significant Figures"
      tiempo_minutos: 4
      enunciado: |
        Perform the following addition and express the answer with the correct number of decimal places:

        $$12.115\text{ g} + 0.32\text{ g}$$

        <p class="highlight-text">Apply the addition/subtraction precision rule.</p>
      solucion:
        titulo_respuesta: |
          $$12.44\text{ g}$$
        pasos:
          - |
            **Identify the decimal places in each term:**
            * $12.115\text{ g} \implies 3\text{ decimal places}$
            * $0.32\text{ g} \implies 2\text{ decimal places}$
          - |
            **Identify the limiting precision rule:** For addition and subtraction, the final result is limited by the term with the **fewest decimal places** ($2\text{ decimal places}$).
          - |
            **Perform the calculation and round:**

            $$12.115 + 0.32 = 12.435$$

            Rounding $12.435$ to $2\text{ decimal places}$ (rounding up at $5$) gives **$12.44\text{ g}$**.

    - id: 6
      titulo: "Operaciones combinadas de multiplicación y división"
      dificultad: "Medium"
      tema: "Significant Figures"
      tiempo_minutos: 4
      enunciado: |
        Calculate the result of the following multi-factor expression:

        $$\frac{4.56 \times 1.2}{0.0350}$$

        <p class="highlight-text">Round the final result according to significant figure rules.</p>
      solucion:
        titulo_respuesta: |
          $$160 \quad \text{or} \quad 1.6 \times 10^2$$
        pasos:
          - |
            **Analyze the sig figs of each input:**
            * $4.56 \implies 3\text{ sig figs}$
            * $1.2 \implies 2\text{ sig figs}$ (limiting value)
            * $0.0350 \implies 3\text{ sig figs}$ ($3, 5, 0$)
          - |
            **Evaluate the expression step-by-step:**
            Numerator product: $4.56 \times 1.2 = 5.472$.
            Division: $\frac{5.472}{0.0350} = 156.342857...$
          - |
            **Round to the fewest total sig figs ($2$ sig figs):**
            Rounding $156.342...$ to $2\text{ sig figs}$ yields **$160$** (or **$1.6 \times 10^2$** in scientific notation).

    - id: 7
      titulo: "Análisis de error: Redondeo en multiplicación"
      dificultad: "Medium"
      tema: "Significant Figures"
      tiempo_minutos: 4
      enunciado: |
        A student measures a rectangular sheet of metal and records:
        $$\text{Length} = 18.45\text{ cm}, \quad \text{Width} = 2.4\text{ cm}$$
        The student calculates the area as $18.45\text{ cm} \times 2.4\text{ cm} = 44.28\text{ cm}^2$ and submits $44.28\text{ cm}^2$ as their final answer.

        1. Identify the conceptual error made by the student.
        2. Provide the corrected final answer with proper units.

        <p class="highlight-text">Spot the precision rule violation and correct it.</p>
      solucion:
        titulo_respuesta: |
          $$\text{Correct Area} = 44\text{ cm}^2$$
        pasos:
          - |
            **Identify the student's error:** The student reported raw calculator output ($44.28\text{ cm}^2$), ignoring the fact that measurement precision is limited by the least precise instrument ($2.4\text{ cm}$, which has only $2\text{ sig figs}$).
          - |
            **Determine the correct precision limit:** Since $2.4\text{ cm}$ has $2\text{ sig figs}$, the product must be rounded to $2\text{ sig figs}$.
          - |
            **Apply correct rounding:**

            $$18.45 \times 2.4 = 44.28 \implies 44\text{ cm}^2$$

    - id: 8
      titulo: "Cálculos con notación científica"
      dificultad: "Medium"
      tema: "Significant Figures"
      tiempo_minutos: 4
      enunciado: |
        Evaluate the expression using powers of ten and express the final result with appropriate significant figures:

        $$\frac{(3.20 \times 10^4) \times (1.5 \times 10^{-2})}{2.00 \times 10^1}$$

        <p class="highlight-text">Combine coefficients and powers of ten separately.</p>
      solucion:
        titulo_respuesta: |
          $$24 \quad \text{or} \quad 2.4 \times 10^1$$
        pasos:
          - |
            **Separate coefficients and exponential terms:**

            $$\text{Coefficients: } \frac{3.20 \times 1.5}{2.00}, \quad \text{Powers of 10: } \frac{10^4 \times 10^{-2}}{10^1}$$
          - |
            **Count sig figs in coefficients:**
            * $3.20 \implies 3\text{ sig figs}$
            * $1.5 \implies 2\text{ sig figs}$ (limiting term)
            * $2.00 \implies 3\text{ sig figs}$
          - |
            **Compute values:**
            Numerical part: $\frac{4.8}{2.00} = 2.4$.
            Exponential part: $10^{4 + (-2) - 1} = 10^1$.
          - |
            **Combine and round to $2\text{ sig figs}$:**

            $$2.4 \times 10^1 = 24$$

    # HARD (9-12)
    - id: 9
      titulo: "Operaciones con jerarquía de operaciones"
      dificultad: "Hard"
      tema: "Significant Figures"
      tiempo_minutos: 5
      enunciado: |
        Calculate the value of the following multi-step expression respecting order of operations and significant figure rules at each stage:

        $$\frac{15.43 - 12.1}{1.25}$$

        <p class="highlight-text">Track decimal places in the numerator before applying multiplication/division rules.</p>
      solucion:
        titulo_respuesta: |
          $$2.6$$
        pasos:
          - |
            **Step 1: Perform subtraction in numerator (apply decimal place rule):**

            $$15.43 - 12.1 = 3.33$$

            Since $12.1$ has $1\text{ decimal place}$, round $3.33$ to $1\text{ decimal place} \implies \mathbf{3.3}$ (which contains **$2$ significant figures**).
          - |
            **Step 2: Perform division (apply total significant figures rule):**
            Divide the rounded numerator by $1.25$:

            $$\frac{3.3}{1.25} = 2.64$$
          - |
            **Step 3: Round to fewest sig figs:** The numerator ($3.3$) has $2\text{ sig figs}$ and the denominator ($1.25$) has $3\text{ sig figs}$. The final result is restricted to $2\text{ sig figs}$:

            $$2.64 \longrightarrow \mathbf{2.6}$$

    - id: 10
      titulo: "Operación multinivel combinada"
      dificultad: "Hard"
      tema: "Significant Figures"
      tiempo_minutos: 5
      enunciado: |
        Compute the final value of the following combined expression:

        $$\frac{(28.52 + 1.30) \times 0.0450}{12.8}$$

        <p class="highlight-text">Apply step-by-step intermediate rounding rules.</p>
      solucion:
        titulo_respuesta: |
          $$0.105 \quad \text{or} \quad 1.05 \times 10^{-1}$$
        pasos:
          - |
            **Step 1: Parentheses addition (decimal places rule):**

            $$28.52 + 1.30 = 29.82$$

            Both terms have $2\text{ decimal places}$, so $29.82$ retains $2\text{ decimal places}$ (giving it **$4$ significant figures**).
          - |
            **Step 2: Evaluate multiplication and division (sig figs rule):**
            Identify sig figs for all factors:
            * $29.82 \implies 4\text{ sig figs}$
            * $0.0450 \implies 3\text{ sig figs}$ ($4, 5, 0$)
            * $12.8 \implies 3\text{ sig figs}$
          - |
            **Step 3: Calculate intermediate product and division:**

            $$\frac{29.82 \times 0.0450}{12.8} = \frac{1.3419}{12.8} = 0.1048359...$$
          - |
            **Step 4: Round to $3$ significant figures:**

            $$0.1048359... \longrightarrow \mathbf{0.105} \quad (\text{or } 1.05 \times 10^{-1})$$

    - id: 11
      titulo: "Aplicación física: Densidad y propagación de precisión"
      dificultad: "Hard"
      tema: "Significant Figures"
      tiempo_minutos: 5
      enunciado: |
        A rectangular block of metal has a measured mass of $m = 145.2\text{ g}$ and dimensions:
        $$\text{Length } l = 4.2\text{ cm}, \quad \text{Width } w = 2.15\text{ cm}, \quad \text{Height } h = 1.8\text{ cm}$$

        1. Calculate the volume $V = l \cdot w \cdot h$ of the block in $\text{cm}^3$, rounded to the correct sig figs.
        2. Calculate the density $\rho = \frac{m}{V}$ in $\text{g/cm}^3$, expressing the final answer with proper significant figures.

        <p class="highlight-text">Show all volume and density steps clearly.</p>
      solucion:
        titulo_respuesta: |
          $$V = 16\text{ cm}^3, \quad \rho = 8.9\text{ g/cm}^3$$
        pasos:
          - |
            **Step 1: Calculate Volume $V = l \cdot w \cdot h$:**
            Sig figs of inputs: $l = 4.2$ ($2\text{ sig figs}$), $w = 2.15$ ($3\text{ sig figs}$), $h = 1.8$ ($2\text{ sig figs}$).

            $$V = 4.2 \times 2.15 \times 1.8 = 16.254\text{ cm}^3$$

            Rounding to $2\text{ sig figs}$ gives **$V = 16\text{ cm}^3$**.
          - |
            **Step 2: Calculate Density $\rho = \frac{m}{V}$:**
            Mass $m = 145.2\text{ g}$ ($4\text{ sig figs}$). Using the unrounded volume $16.254\text{ cm}^3$ (limited to $2\text{ sig figs}$ precision):

            $$\rho = \frac{145.2}{16.254} = 8.93318... \text{ g/cm}^3$$
          - |
            **Step 3: Round density to $2\text{ sig figs}$:**

            $$\rho = 8.9\text{ g/cm}^3$$

    - id: 12
      titulo: "Expresión compleja en notación científica"
      dificultad: "Hard"
      tema: "Significant Figures"
      tiempo_minutos: 5
      enunciado: |
        Simplify the following scientific notation expression completely and round to the proper number of significant figures:

        $$\frac{4.32 \times 10^3 + 1.20 \times 10^2}{2.15 \times 10^{-2}}$$

        <p class="highlight-text">Align powers of ten before performing addition in the numerator.</p>
      solucion:
        titulo_respuesta: |
          $$2.07 \times 10^5 \quad \text{or} \quad 207000$$
        pasos:
          - |
            **Step 1: Align exponential terms in numerator to perform addition:**
            Convert $1.20 \times 10^2$ to match $10^3$: $0.120 \times 10^3$.

            $$4.32 \times 10^3 + 0.120 \times 10^3 = (4.32 + 0.120) \times 10^3 = 4.440 \times 10^3$$
          - |
            **Step 2: Apply decimal place precision rule to numerator:**
            $4.32$ has $2\text{ decimal places}$, while $0.120$ has $3\text{ decimal places}$.
            Round $4.440$ to $2\text{ decimal places} \implies \mathbf{4.44 \times 10^3}$ (which contains **$3$ significant figures**).
          - |
            **Step 3: Perform division:**

            $$\frac{4.44 \times 10^3}{2.15 \times 10^{-2}} = \left( \frac{4.44}{2.15} \right) \times 10^{3 - (-2)} = 2.065116... \times 10^5$$
          - |
            **Step 4: Round to $3$ significant figures:**
            Both $4.44$ and $2.15$ have $3\text{ sig figs}$.

            $$2.065116... \times 10^5 \longrightarrow \mathbf{2.07 \times 10^5} \quad (\text{or } 207000)$$