# _data/challenges.yml

- id: "rationalization"
  titulo_evaluacion: "Rationalizing Denominators Challenges"
  topic: "Rationalizing Denominators"
  description: "Exercises on rationalizing monomial, nth-root, and binomial denominators using conjugates."
  preguntas:
    # CASE 1: Denominator of the form a√b
    - id: 1
      titulo: "Simple Monomial Rationalization"
      dificultad: "Low"
      tema: "Rationalization"
      tiempo_minutos: 3
      enunciado: |
        Rationalize the denominator of the following algebraic expression:
  
        $$\frac{6}{5\sqrt{3}}$$
  
        <p class="highlight-text">Express the final answer in its most simplified form.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{2\sqrt{3}}{5}$$
        pasos:
          - |
            **Identify the case:** Rationalization of a denominator of the form $a\sqrt{b}$ (single square root in a monomial).
          - |
            **Multiply by a convenient 1:** Multiply both the numerator and the denominator by the radical $\sqrt{3}$:
  
            $$\frac{6}{5\sqrt{3}} \cdot \frac{\sqrt{3}}{\sqrt{3}} = \frac{6\sqrt{3}}{5(\sqrt{3})^2}$$
          - |
            **Simplify:** Using exponent and radical laws $(\sqrt{3})^2 = 3$:
  
            $$\frac{6\sqrt{3}}{5 \cdot 3} = \frac{6\sqrt{3}}{15} = \frac{2\sqrt{3}}{5}$$
  
    - id: 2
      titulo: "Simple Monomial Rationalization"
      dificultad: "Low"
      tema: "Rationalization"
      tiempo_minutos: 3
      enunciado: |
        Rationalize the denominator of the following expression:
  
        $$\frac{10}{3\sqrt{5}}$$
  
        <p class="highlight-text">Express the final answer in its most simplified form.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{2\sqrt{5}}{3}$$
        pasos:
          - |
            **Identify the case:** Monomial denominator of the form $a\sqrt{b}$.
          - |
            **Multiply by a convenient 1:** Multiply top and bottom by $\sqrt{5}$:
  
            $$\frac{10}{3\sqrt{5}} \cdot \frac{\sqrt{5}}{\sqrt{5}} = \frac{10\sqrt{5}}{3(\sqrt{5})^2}$$
          - |
            **Simplify:** Simplifying the radical $(\sqrt{5})^2 = 5$:
  
            $$\frac{10\sqrt{5}}{3 \cdot 5} = \frac{10\sqrt{5}}{15} = \frac{2\sqrt{5}}{3}$$
  
    - id: 3
      titulo: "Simple Monomial Rationalization"
      dificultad: "Medium"
      tema: "Rationalization"
      tiempo_minutos: 3
      enunciado: |
        Rationalize the denominator of the following expression:
  
        $$\frac{14}{2\sqrt{7}}$$
  
        <p class="highlight-text">Express the final answer in its most simplified form.</p>
      solucion:
        titulo_respuesta: |
          $$\sqrt{7}$$
        pasos:
          - |
            **Identify the case:** Denominator of the form $a\sqrt{b}$.
          - |
            **Multiply by a convenient 1:** Multiply by $\frac{\sqrt{7}}{\sqrt{7}}$:
  
            $$\frac{14}{2\sqrt{7}} \cdot \frac{\sqrt{7}}{\sqrt{7}} = \frac{14\sqrt{7}}{2(\sqrt{7})^2}$$
          - |
            **Simplify:** Evaluating $(\sqrt{7})^2 = 7$:
  
            $$\frac{14\sqrt{7}}{2 \cdot 7} = \frac{14\sqrt{7}}{14} = \sqrt{7}$$
  
    - id: 4
      titulo: "Simple Monomial Rationalization"
      dificultad: "Medium"
      tema: "Rationalization"
      tiempo_minutos: 3
      enunciado: |
        Rationalize the denominator of the following expression:
  
        $$\frac{9}{4\sqrt{6}}$$
  
        <p class="highlight-text">Express the final answer in its most simplified form.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{3\sqrt{6}}{8}$$
        pasos:
          - |
            **Identify the case:** Monomial denominator of the form $a\sqrt{b}$.
          - |
            **Multiply by a convenient 1:** Multiply by $\frac{\sqrt{6}}{\sqrt{6}}$:
  
            $$\frac{9}{4\sqrt{6}} \cdot \frac{\sqrt{6}}{\sqrt{6}} = \frac{9\sqrt{6}}{4(\sqrt{6})^2}$$
          - |
            **Simplify:** Applying $(\sqrt{6})^2 = 6$ and reducing fractions:
  
            $$\frac{9\sqrt{6}}{4 \cdot 6} = \frac{9\sqrt{6}}{24} = \frac{3\sqrt{6}}{8}$$
  
    # CASE 2: Denominator of the form a\sqrt[n]{b}
    - id: 5
      titulo: "nth-Root Rationalization"
      dificultad: "Medium"
      tema: "Rationalization"
      tiempo_minutos: 3
      enunciado: |
        Rationalize the denominator of the following expression:
  
        $$\frac{4}{\sqrt[3]{2}}$$
  
        <p class="highlight-text">Express the answer in terms of the simplified radical.</p>
      solucion:
        titulo_respuesta: |
          $$2\sqrt[3]{4}$$
        pasos:
          - |
            **Identify the case:** Denominator of the form $a\sqrt[n]{b^k}$ with $n = 3$ and $k = 1$.
          - |
            **Multiply by a convenient 1:** To complete the radicand exponent to $3$, multiply by $\frac{\sqrt[3]{2^{3-1}}}{\sqrt[3]{2^{3-1}}} = \frac{\sqrt[3]{2^2}}{\sqrt[3]{2^2}}$:
  
            $$\frac{4}{\sqrt[3]{2}} \cdot \frac{\sqrt[3]{4}}{\sqrt[3]{4}} = \frac{4\sqrt[3]{4}}{\sqrt[3]{2^3}}$$
          - |
            **Simplify:** Using exponent laws ($\sqrt[n]{a^n} = a$):
  
            $$\frac{4\sqrt[3]{4}}{2} = 2\sqrt[3]{4}$$
  
    - id: 6
      titulo: "nth-Root Rationalization"
      dificultad: "Medium"
      tema: "Rationalization"
      tiempo_minutos: 3
      enunciado: |
        Rationalize the denominator of the following expression:
  
        $$\frac{5}{2\sqrt[4]{3}}$$
  
        <p class="highlight-text">Express the final answer in its most simplified form.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{5\sqrt[4]{27}}{6}$$
        pasos:
          - |
            **Identify the case:** Denominator with $n$-th radical of the form $a\sqrt[n]{b}$ ($n = 4$, $b = 3^1$). Only $3^3$ is needed to complete the index.
          - |
            **Multiply by a convenient 1:** Multiply by $\frac{\sqrt[4]{3^3}}{\sqrt[4]{3^3}} = \frac{\sqrt[4]{27}}{\sqrt[4]{27}}$:
  
            $$\frac{5}{2\sqrt[4]{3}} \cdot \frac{\sqrt[4]{27}}{\sqrt[4]{27}} = \frac{5\sqrt[4]{27}}{2\sqrt[4]{3^4}}$$
          - |
            **Simplify:** Applying $\sqrt[4]{3^4} = 3$:
  
            $$\frac{5\sqrt[4]{27}}{2 \cdot 3} = \frac{5\sqrt[4]{27}}{6}$$
  
    - id: 7
      titulo: "nth-Root Rationalization"
      dificultad: "High"
      tema: "Rationalization"
      tiempo_minutos: 3
      enunciado: |
        Rationalize the denominator of the following expression:
  
        $$\frac{6}{\sqrt[5]{4}}$$
  
        <p class="highlight-text">Hint: first express the base of the radicando as a prime power.</p>
      solucion:
        titulo_respuesta: |
          $$3\sqrt[5]{8}$$
        pasos:
          - |
            **Identify the case:** Denominator with $n$-th root. Rewrite the base: $4 = 2^2$, giving $\sqrt[5]{2^2}$.
          - |
            **Multiply by a convenient 1:** To reach the exponent $5$, $2^3 = 8$ is needed. Multiply by $\frac{\sqrt[5]{8}}{\sqrt[5]{8}}$:
  
            $$\frac{6}{\sqrt[5]{2^2}} \cdot \frac{\sqrt[5]{2^3}}{\sqrt[5]{2^3}} = \frac{6\sqrt[5]{8}}{\sqrt[5]{2^5}}$$
          - |
            **Simplify:** Reducing the root $\sqrt[5]{2^5} = 2$:
  
            $$\frac{6\sqrt[5]{8}}{2} = 3\sqrt[5]{8}$$
  
    - id: 8
      titulo: "nth-Root Rationalization"
      dificultad: "High"
      tema: "Rationalization"
      tiempo_minutos: 3
      enunciado: |
        Rationalize the denominator of the following expression:
  
        $$\frac{12}{3\sqrt[3]{9}}$$
  
        <p class="highlight-text">Express the final answer in its most simplified form.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{4\sqrt[3]{3}}{3}$$
        pasos:
          - |
            **Identify the case:** Denominator of the form $a\sqrt[n]{b^k}$. Expressing the base as a power: $9 = 3^2$, resulting in $\sqrt[3]{3^2}$.
          - |
            **Multiply by a convenient 1:** $3^1$ is needed to complete power 3. Multiply by $\frac{\sqrt[3]{3}}{\sqrt[3]{3}}$:
  
            $$\frac{12}{3\sqrt[3]{3^2}} \cdot \frac{\sqrt[3]{3}}{\sqrt[3]{3}} = \frac{12\sqrt[3]{3}}{3\sqrt[3]{3^3}}$$
          - |
            **Simplify:** Since $\sqrt[3]{3^3} = 3$:
  
            $$\frac{12\sqrt[3]{3}}{3 \cdot 3} = \frac{12\sqrt[3]{3}}{9} = \frac{4\sqrt[3]{3}}{3}$$
  
    # CASE 3: Denominator with addition or subtraction of roots (using conjugates)
    - id: 9
      titulo: "Rationalization by Conjugate"
      dificultad: "Medium"
      tema: "Rationalization"
      tiempo_minutos: 5
      enunciado: |
        Rationalize the denominator of the following expression:
  
        $$\frac{4}{\sqrt{5} - 1}$$
  
        <p class="highlight-text">Express the final answer in its most simplified form.</p>
      solucion:
        titulo_respuesta: |
          $$\sqrt{5} + 1$$
        pasos:
          - |
            **Identify the case:** Binomial in the denominator with a square root ($\sqrt{a} - b$). Requires using the conjugate.
          - |
            **Multiply by a convenient 1:** The conjugate of $(\sqrt{5} - 1)$ is $(\sqrt{5} + 1)$:
  
            $$\frac{4}{\sqrt{5} - 1} \cdot \frac{\sqrt{5} + 1}{\sqrt{5} + 1} = \frac{4(\sqrt{5} + 1)}{(\sqrt{5} - 1)(\sqrt{5} + 1)}$$
          - |
            **Simplify using difference of squares:** $(x - y)(x + y) = x^2 - y^2$:
  
            $$\frac{4(\sqrt{5} + 1)}{(\sqrt{5})^2 - (1)^2} = \frac{4(\sqrt{5} + 1)}{5 - 1} = \frac{4(\sqrt{5} + 1)}{4} = \sqrt{5} + 1$$
  
    - id: 10
      titulo: "Rationalization by Conjugate"
      dificultad: "Medium"
      tema: "Rationalization"
      tiempo_minutos: 5
      enunciado: |
        Rationalize the denominator of the following expression:
  
        $$\frac{6}{\sqrt{7} + \sqrt{3}}$$
  
        <p class="highlight-text">Express the final answer in its most simplified form.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{3(\sqrt{7} - \sqrt{3})}{2}$$
        pasos:
          - |
            **Identify the case:** Binomial of the form $\sqrt{a} + \sqrt{b}$ in the denominator.
          - |
            **Multiply by a convenient 1:** Multiply by the conjugate binomial $\frac{\sqrt{7} - \sqrt{3}}{\sqrt{7} - \sqrt{3}}$:
  
            $$\frac{6}{\sqrt{7} + \sqrt{3}} \cdot \frac{\sqrt{7} - \sqrt{3}}{\sqrt{7} - \sqrt{3}} = \frac{6(\sqrt{7} - \sqrt{3})}{(\sqrt{7} + \sqrt{3})(\sqrt{7} - \sqrt{3})}$$
          - |
            **Simplify using difference of squares:**
  
            $$\frac{6(\sqrt{7} - \sqrt{3})}{(\sqrt{7})^2 - (\sqrt{3})^2} = \frac{6(\sqrt{7} - \sqrt{3})}{7 - 3} = \frac{6(\sqrt{7} - \sqrt{3})}{4} = \frac{3(\sqrt{7} - \sqrt{3})}{2}$$
  
    - id: 11
      titulo: "Rationalization by Conjugate"
      dificultad: "High"
      tema: "Rationalization"
      tiempo_minutos: 5
      enunciado: |
        Rationalize the denominator of the following expression:
  
        $$\frac{\sqrt{3}}{2\sqrt{2} - \sqrt{5}}$$
  
        <p class="highlight-text">Express the final answer by expanding or factoring the numerator as convenient.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{2\sqrt{6} + \sqrt{15}}{3}$$
        pasos:
          - |
            **Identify the case:** Subtraction of radicals in the denominator where one has an integer coefficient ($a\sqrt{b} - \sqrt{c}$).
          - |
            **Multiply by a convenient 1:** The conjugate of $(2\sqrt{2} - \sqrt{5})$ is $(2\sqrt{2} + \sqrt{5})$:
  
            $$\frac{\sqrt{3}}{2\sqrt{2} - \sqrt{5}} \cdot \frac{2\sqrt{2} + \sqrt{5}}{2\sqrt{2} + \sqrt{5}} = \frac{\sqrt{3}(2\sqrt{2} + \sqrt{5})}{(2\sqrt{2} - \sqrt{5})(2\sqrt{2} + \sqrt{5})}$$
          - |
            **Simplify using difference of squares and distributive property:**
            Denominator: $(2\sqrt{2})^2 - (\sqrt{5})^2 = (4 \cdot 2) - 5 = 8 - 5 = 3$.
  
            Numerator: $\sqrt{3} \cdot 2\sqrt{2} + \sqrt{3} \cdot \sqrt{5} = 2\sqrt{6} + \sqrt{15}$.
  
            Final result:
  
            $$\frac{2\sqrt{6} + \sqrt{15}}{3}$$
  
    - id: 12
      titulo: "Rationalization by Conjugate"
      dificultad: "High"
      tema: "Rationalization"
      tiempo_minutos: 5
      enunciado: |
        Rationalize the denominator of the following algebraic-numerical expression:
  
        $$\frac{\sqrt{6} + \sqrt{2}}{\sqrt{6} - \sqrt{2}}$$
  
        <p class="highlight-text">Express the final answer in its most simplified form.</p>
      solucion:
        titulo_respuesta: |
          $$2 + \sqrt{3}$$
        pasos:
          - |
            **Identify the case:** Binomial with radicals in numerator and denominator ($\frac{\sqrt{a}+\sqrt{b}}{\sqrt{a}-\sqrt{b}}$). Rationalize the denominator using its conjugate.
          - |
            **Multiply by a convenient 1:** Multiply by $\frac{\sqrt{6} + \sqrt{2}}{\sqrt{6} + \sqrt{2}}$:
  
            $$\frac{\sqrt{6} + \sqrt{2}}{\sqrt{6} - \sqrt{2}} \cdot \frac{\sqrt{6} + \sqrt{2}}{\sqrt{6} + \sqrt{2}} = \frac{(\sqrt{6} + \sqrt{2})^2}{(\sqrt{6} - \sqrt{2})(\sqrt{6} + \sqrt{2})}$$
          - |
            **Simplify using squared binomial in numerator and difference of squares in denominator:**
            Numerator: $(\sqrt{6})^2 + 2\sqrt{6}\sqrt{2} + (\sqrt{2})^2 = 6 + 2\sqrt{12} + 2 = 8 + 2(2\sqrt{3}) = 8 + 4\sqrt{3}$.
  
            Denominator: $(\sqrt{6})^2 - (\sqrt{2})^2 = 6 - 2 = 4$.
  
            Resulting fraction:
  
            $$\frac{8 + 4\sqrt{3}}{4} = \frac{8}{4} + \frac{4\sqrt{3}}{4} = 2 + \sqrt{3}$$
            
