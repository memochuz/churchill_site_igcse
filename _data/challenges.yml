    # EASY (1-4)
    - id: 1
      titulo: "Raíz de monomio"
      dificultad: "Easy"
      tema: "Laws of Radicals"
      tiempo_minutos: 3
      enunciado: |
        Simplify the radical expression completely:

        $$\sqrt{\frac{x^{-4} y^8}{16}}$$

        <p class="highlight-text">Express the final answer with positive exponents.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{y^4}{4x^2}$$
        pasos:
          - |
            **Apply quotient property of radicals $\sqrt{\frac{A}{B}} = \frac{\sqrt{A}}{\sqrt{B}}$:**

            $$\frac{\sqrt{x^{-4}y^8}}{\sqrt{16}}$$
          - |
            **Convert radicals to fractional exponents:**

            $$\frac{(x^{-4}y^8)^{\frac{1}{2}}}{4} = \frac{x^{-2}y^4}{4}$$
          - |
            **Write with positive exponents:**

            $$\frac{y^4}{4x^2}$$

    - id: 2
      titulo: "Cociente de radicales"
