      solucion:
        titulo_respuesta: |
          $$2x^2 y^3 \sqrt[5]{2x^3 y^3}$$
        pasos:
          - |
            **Factorize into prime factors and variables:** Prime factorize $64 = 2^6$ and expand variable terms:

            $$\sqrt[5]{(2 \cdot 2 \cdot 2 \cdot 2 \cdot 2 \cdot 2) \cdot x^{13} \cdot y^{18}}$$
          - |
            **Group depending on the index ($n = 5$):** Form explicit groups of 5:

            $$\sqrt[5]{(2^5 \cdot 2) \cdot (x^5 \cdot x^5 \cdot x^3) \cdot (y^5 \cdot y^5 \cdot y^5 \cdot y^3)}$$
          - |
            **Extract and multiply:** Move one factor out for each group of 5 ($2, x, x, y, y, y$):

            $$(2 \cdot x \cdot x \cdot y \cdot y \cdot y)\sqrt[5]{2 \cdot x^3 \cdot y^3} = 2x^2 y^3 \sqrt[5]{2x^3 y^3}$$

