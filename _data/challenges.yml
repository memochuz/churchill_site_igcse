# ======================================================================
- id: "rationalization"
  titulo_evaluacion: "Rationalizing Denominators Challenges"
  topic: "Rationalizing Denominators"
  description: "Exercises on rationalizing monomial, nth-root, and binomial denominators using conjugates."
  preguntas:
    # CASE 1: Denominator of the form a√b
    - id: 1
      titulo: "Monomio simple 1"
      dificultad: "Easy"
      tema: "Rationalization"
      tiempo_minutos: 3
      enunciado: |
        Rationalize the denominator of the following algebraic expression:
  
        $$\frac{6}{5\sqrt{3}}$$
  
        <p class="highlight-text">Express the final answer in its most simplified form.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{2\sqrt{3}}{5}$$
        pasos:
          - |
            **Identify the case:** Rationalization of a denominator of the form $a\sqrt{b}$ (single square root in a monomial).
          - |
            **Multiply by a convenient 1:** Multiply both the numerator and the denominator by the radical $\sqrt{3}$:
  
            $$\frac{6}{5\sqrt{3}} \cdot \frac{\sqrt{3}}{\sqrt{3}} = \frac{6\sqrt{3}}{5(\sqrt{3})^2}$$
          - |
            **Simplify:** Using exponent and radical laws $(\sqrt{3})^2 = 3$:
  
            $$\frac{6\sqrt{3}}{5 \cdot 3} = \frac{6\sqrt{3}}{15} = \frac{2\sqrt{3}}{5}$$
  
    - id: 2
      titulo: "Monomio simple 2"
      dificultad: "Easy"
      tema: "Rationalization"
      tiempo_minutos: 3
      enunciado: |
        Rationalize the denominator of the following expression:
  
        $$\frac{10}{3\sqrt{5}}$$
  
        <p class="highlight-text">Express the final answer in its most simplified form.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{2\sqrt{5}}{3}$$
        pasos:
          - |
            **Identify the case:** Monomial denominator of the form $a\sqrt{b}$.
          - |
            **Multiply by a convenient 1:** Multiply top and bottom by $\sqrt{5}$:
  
            $$\frac{10}{3\sqrt{5}} \cdot \frac{\sqrt{5}}{\sqrt{5}} = \frac{10\sqrt{5}}{3(\sqrt{5})^2}$$
          - |
            **Simplify:** Simplifying the radical $(\sqrt{5})^2 = 5$:
  
            $$\frac{10\sqrt{5}}{3 \cdot 5} = \frac{10\sqrt{5}}{15} = \frac{2\sqrt{5}}{3}$$
  
    - id: 3
      titulo: "Monomio simple 3"
      dificultad: "Medium"
      tema: "Rationalization"
      tiempo_minutos: 3
      enunciado: |
        Rationalize the denominator of the following expression:
  
        $$\frac{14}{2\sqrt{7}}$$
  
        <p class="highlight-text">Express the final answer in its most simplified form.</p>
      solucion:
        titulo_respuesta: |
          $$\sqrt{7}$$
        pasos:
          - |
            **Identify the case:** Denominator of the form $a\sqrt{b}$.
          - |
            **Multiply by a convenient 1:** Multiply by $\frac{\sqrt{7}}{\sqrt{7}}$:
  
            $$\frac{14}{2\sqrt{7}} \cdot \frac{\sqrt{7}}{\sqrt{7}} = \frac{14\sqrt{7}}{2(\sqrt{7})^2}$$
          - |
            **Simplify:** Evaluating $(\sqrt{7})^2 = 7$:
  
            $$\frac{14\sqrt{7}}{2 \cdot 7} = \frac{14\sqrt{7}}{14} = \sqrt{7}$$
  
    - id: 4
      titulo: "Monomio simple 4"
      dificultad: "Medium"
      tema: "Rationalization"
      tiempo_minutos: 3
      enunciado: |
        Rationalize the denominator of the following expression:
  
        $$\frac{9}{4\sqrt{6}}$$
  
        <p class="highlight-text">Express the final answer in its most simplified form.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{3\sqrt{6}}{8}$$
        pasos:
          - |
            **Identify the case:** Monomial denominator of the form $a\sqrt{b}$.
          - |
            **Multiply by a convenient 1:** Multiply by $\frac{\sqrt{6}}{\sqrt{6}}$:
  
            $$\frac{9}{4\sqrt{6}} \cdot \frac{\sqrt{6}}{\sqrt{6}} = \frac{9\sqrt{6}}{4(\sqrt{6})^2}$$
          - |
            **Simplify:** Applying $(\sqrt{6})^2 = 6$ and reducing fractions:
  
            $$\frac{9\sqrt{6}}{4 \cdot 6} = \frac{9\sqrt{6}}{24} = \frac{3\sqrt{6}}{8}$$
  
    # CASE 2: Denominator of the form a\sqrt[n]{b}
    - id: 5
      titulo: "Raíz n-ésima 1"
      dificultad: "Medium"
      tema: "Rationalization"
      tiempo_minutos: 3
      enunciado: |
        Rationalize the denominator of the following expression:
  
        $$\frac{4}{\sqrt[3]{2}}$$
  
        <p class="highlight-text">Express the answer in terms of the simplified radical.</p>
      solucion:
        titulo_respuesta: |
          $$2\sqrt[3]{4}$$
        pasos:
          - |
            **Identify the case:** Denominator of the form $a\sqrt[n]{b^k}$ with $n = 3$ and $k = 1$.
          - |
            **Multiply by a convenient 1:** To complete the radicand exponent to $3$, multiply by $\frac{\sqrt[3]{2^{3-1}}}{\sqrt[3]{2^{3-1}}} = \frac{\sqrt[3]{2^2}}{\sqrt[3]{2^2}}$:
  
            $$\frac{4}{\sqrt[3]{2}} \cdot \frac{\sqrt[3]{4}}{\sqrt[3]{4}} = \frac{4\sqrt[3]{4}}{\sqrt[3]{2^3}}$$
          - |
            **Simplify:** Using exponent laws ($\sqrt[n]{a^n} = a$):
  
            $$\frac{4\sqrt[3]{4}}{2} = 2\sqrt[3]{4}$$
  
    - id: 6
      titulo: "Raíz n-ésima 2"
      dificultad: "Medium"
      tema: "Rationalization"
      tiempo_minutos: 3
      enunciado: |
        Rationalize the denominator of the following expression:
  
        $$\frac{5}{2\sqrt[4]{3}}$$
  
        <p class="highlight-text">Express the final answer in its most simplified form.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{5\sqrt[4]{27}}{6}$$
        pasos:
          - |
            **Identify the case:** Denominator with $n$-th radical of the form $a\sqrt[n]{b}$ ($n = 4$, $b = 3^1$). Only $3^3$ is needed to complete the index.
          - |
            **Multiply by a convenient 1:** Multiply by $\frac{\sqrt[4]{3^3}}{\sqrt[4]{3^3}} = \frac{\sqrt[4]{27}}{\sqrt[4]{27}}$:
  
            $$\frac{5}{2\sqrt[4]{3}} \cdot \frac{\sqrt[4]{27}}{\sqrt[4]{27}} = \frac{5\sqrt[4]{27}}{2\sqrt[4]{3^4}}$$
          - |
            **Simplify:** Applying $\sqrt[4]{3^4} = 3$:
  
            $$\frac{5\sqrt[4]{27}}{2 \cdot 3} = \frac{5\sqrt[4]{27}}{6}$$
  
    - id: 7
      titulo: "Raíz n-ésima 3"
      dificultad: "Hard"
      tema: "Rationalization"
      tiempo_minutos: 3
      enunciado: |
        Rationalize the denominator of the following expression:
  
        $$\frac{6}{\sqrt[5]{4}}$$
  
        <p class="highlight-text">Hint: first express the base of the radicando as a prime power.</p>
      solucion:
        titulo_respuesta: |
          $$3\sqrt[5]{8}$$
        pasos:
          - |
            **Identify the case:** Denominator with $n$-th root. Rewrite the base: $4 = 2^2$, giving $\sqrt[5]{2^2}$.
          - |
            **Multiply by a convenient 1:** To reach the exponent $5$, $2^3 = 8$ is needed. Multiply by $\frac{\sqrt[5]{8}}{\sqrt[5]{8}}$:
  
            $$\frac{6}{\sqrt[5]{2^2}} \cdot \frac{\sqrt[5]{2^3}}{\sqrt[5]{2^3}} = \frac{6\sqrt[5]{8}}{\sqrt[5]{2^5}}$$
          - |
            **Simplify:** Reducing the root $\sqrt[5]{2^5} = 2$:
  
            $$\frac{6\sqrt[5]{8}}{2} = 3\sqrt[5]{8}$$
  
    - id: 8
      titulo: "Raíz n-ésima 4"
      dificultad: "Hard"
      tema: "Rationalization"
      tiempo_minutos: 3
      enunciado: |
        Rationalize the denominator of the following expression:
  
        $$\frac{12}{3\sqrt[3]{9}}$$
  
        <p class="highlight-text">Express the final answer in its most simplified form.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{4\sqrt[3]{3}}{3}$$
        pasos:
          - |
            **Identify the case:** Denominator of the form $a\sqrt[n]{b^k}$. Expressing the base as a power: $9 = 3^2$, resulting in $\sqrt[3]{3^2}$.
          - |
            **Multiply by a convenient 1:** $3^1$ is needed to complete power 3. Multiply by $\frac{\sqrt[3]{3}}{\sqrt[3]{3}}$:
  
            $$\frac{12}{3\sqrt[3]{3^2}} \cdot \frac{\sqrt[3]{3}}{\sqrt[3]{3}} = \frac{12\sqrt[3]{3}}{3\sqrt[3]{3^3}}$$
          - |
            **Simplify:** Since $\sqrt[3]{3^3} = 3$:
  
            $$\frac{12\sqrt[3]{3}}{3 \cdot 3} = \frac{12\sqrt[3]{3}}{9} = \frac{4\sqrt[3]{3}}{3}$$
  
    # CASE 3: Denominator with addition or subtraction of roots (using conjugates)
    - id: 9
      titulo: "Conjugado 1"
      dificultad: "Medium"
      tema: "Rationalization"
      tiempo_minutos: 5
      enunciado: |
        Rationalize the denominator of the following expression:
  
        $$\frac{4}{\sqrt{5} - 1}$$
  
        <p class="highlight-text">Express the final answer in its most simplified form.</p>
      solucion:
        titulo_respuesta: |
          $$\sqrt{5} + 1$$
        pasos:
          - |
            **Identify the case:** Binomial in the denominator with a square root ($\sqrt{a} - b$). Requires using the conjugate.
          - |
            **Multiply by a convenient 1:** The conjugate of $(\sqrt{5} - 1)$ is $(\sqrt{5} + 1)$:
  
            $$\frac{4}{\sqrt{5} - 1} \cdot \frac{\sqrt{5} + 1}{\sqrt{5} + 1} = \frac{4(\sqrt{5} + 1)}{(\sqrt{5} - 1)(\sqrt{5} + 1)}$$
          - |
            **Simplify using difference of squares:** $(x - y)(x + y) = x^2 - y^2$:
  
            $$\frac{4(\sqrt{5} + 1)}{(\sqrt{5})^2 - (1)^2} = \frac{4(\sqrt{5} + 1)}{5 - 1} = \frac{4(\sqrt{5} + 1)}{4} = \sqrt{5} + 1$$
  
    - id: 10
      titulo: "Conjugado 2"
      dificultad: "Medium"
      tema: "Rationalization"
      tiempo_minutos: 5
      enunciado: |
        Rationalize the denominator of the following expression:
  
        $$\frac{6}{\sqrt{7} + \sqrt{3}}$$
  
        <p class="highlight-text">Express the final answer in its most simplified form.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{3(\sqrt{7} - \sqrt{3})}{2}$$
        pasos:
          - |
            **Identify the case:** Binomial of the form $\sqrt{a} + \sqrt{b}$ in the denominator.
          - |
            **Multiply by a convenient 1:** Multiply by the conjugate binomial $\frac{\sqrt{7} - \sqrt{3}}{\sqrt{7} - \sqrt{3}}$:
  
            $$\frac{6}{\sqrt{7} + \sqrt{3}} \cdot \frac{\sqrt{7} - \sqrt{3}}{\sqrt{7} - \sqrt{3}} = \frac{6(\sqrt{7} - \sqrt{3})}{(\sqrt{7} + \sqrt{3})(\sqrt{7} - \sqrt{3})}$$
          - |
            **Simplify using difference of squares:**
  
            $$\frac{6(\sqrt{7} - \sqrt{3})}{(\sqrt{7})^2 - (\sqrt{3})^2} = \frac{6(\sqrt{7} - \sqrt{3})}{7 - 3} = \frac{6(\sqrt{7} - \sqrt{3})}{4} = \frac{3(\sqrt{7} - \sqrt{3})}{2}$$
  
    - id: 11
      titulo: "Conjugado 3"
      dificultad: "Hard"
      tema: "Rationalization"
      tiempo_minutos: 5
      enunciado: |
        Rationalize the denominator of the following expression:
  
        $$\frac{\sqrt{3}}{2\sqrt{2} - \sqrt{5}}$$
  
        <p class="highlight-text">Express the final answer by expanding or factoring the numerator as convenient.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{2\sqrt{6} + \sqrt{15}}{3}$$
        pasos:
          - |
            **Identify the case:** Subtraction of radicals in the denominator where one has an integer coefficient ($a\sqrt{b} - \sqrt{c}$).
          - |
            **Multiply by a convenient 1:** The conjugate of $(2\sqrt{2} - \sqrt{5})$ is $(2\sqrt{2} + \sqrt{5})$:
  
            $$\frac{\sqrt{3}}{2\sqrt{2} - \sqrt{5}} \cdot \frac{2\sqrt{2} + \sqrt{5}}{2\sqrt{2} + \sqrt{5}} = \frac{\sqrt{3}(2\sqrt{2} + \sqrt{5})}{(2\sqrt{2} - \sqrt{5})(2\sqrt{2} + \sqrt{5})}$$
          - |
            **Simplify using difference of squares and distributive property:**
            Denominator: $(2\sqrt{2})^2 - (\sqrt{5})^2 = (4 \cdot 2) - 5 = 8 - 5 = 3$.
  
            Numerator: $\sqrt{3} \cdot 2\sqrt{2} + \sqrt{3} \cdot \sqrt{5} = 2\sqrt{6} + \sqrt{15}$.
  
            Final result:
  
            $$\frac{2\sqrt{6} + \sqrt{15}}{3}$$
  
    - id: 12
      titulo: "Conjugado 4"
      dificultad: "Hard"
      tema: "Rationalization"
      tiempo_minutos: 5
      enunciado: |
        Rationalize the denominator of the following algebraic-numerical expression:
  
        $$\frac{\sqrt{6} + \sqrt{2}}{\sqrt{6} - \sqrt{2}}$$
  
        <p class="highlight-text">Express the final answer in its most simplified form.</p>
      solucion:
        titulo_respuesta: |
          $$2 + \sqrt{3}$$
        pasos:
          - |
            **Identify the case:** Binomial with radicals in numerator and denominator ($\frac{\sqrt{a}+\sqrt{b}}{\sqrt{a}-\sqrt{b}}$). Rationalize the denominator using its conjugate.
          - |
            **Multiply by a convenient 1:** Multiply by $\frac{\sqrt{6} + \sqrt{2}}{\sqrt{6} + \sqrt{2}}$:
  
            $$\frac{\sqrt{6} + \sqrt{2}}{\sqrt{6} - \sqrt{2}} \cdot \frac{\sqrt{6} + \sqrt{2}}{\sqrt{6} + \sqrt{2}} = \frac{(\sqrt{6} + \sqrt{2})^2}{(\sqrt{6} - \sqrt{2})(\sqrt{6} + \sqrt{2})}$$
          - |
            **Simplify using squared binomial in numerator and difference of squares in denominator:**
            Numerator: $(\sqrt{6})^2 + 2\sqrt{6}\sqrt{2} + (\sqrt{2})^2 = 6 + 2\sqrt{12} + 2 = 8 + 2(2\sqrt{3}) = 8 + 4\sqrt{3}$.
  
            Denominator: $(\sqrt{6})^2 - (\sqrt{2})^2 = 6 - 2 = 4$.
  
            Resulting fraction:
  
            $$\frac{8 + 4\sqrt{3}}{4} = \frac{8}{4} + \frac{4\sqrt{3}}{4} = 2 + \sqrt{3}$$
            
# ======================================================================
# LAWS OF EXPONENTS ASSESSMENT
# ======================================================================
- id: "laws_of_exponents"
  titulo_evaluacion: "Laws of Exponents Challenges"
  topic: "Laws of Exponents"
  description: "Comprehensive problem set on exponent properties, negative power rules, quotient rules, and power-of-a-power simplifications."
  preguntas:
    # EASY (1-4)
    - id: 1
      titulo: "Potencias y cociente"
      dificultad: "Easy"
      tema: "Laws of Exponents"
      tiempo_minutos: 3
      enunciado: |
        Simplify the algebraic expression completely. Write your final answer using positive exponents only:

        $$\frac{(a^{-3}b^2)^{-2}}{(a^2b^{-4})^3}$$

        <p class="highlight-text">Express the answer in simplest form with positive exponents.</p>
      solucion:
        titulo_respuesta: |
          $$b^8$$
        pasos:
          - |
            **Apply power of a power rule $(x^m)^n = x^{m \cdot n}$:** Distribute the outer exponent to each factor in the numerator and denominator:

            $$\frac{a^{(-3)(-2)}b^{(2)(-2)}}{a^{(2)(3)}b^{(-4)(3)}} = \frac{a^6 b^{-4}}{a^6 b^{-12}}$$
          - |
            **Apply quotient rule $\frac{x^m}{x^n} = x^{m-n}$:** Group base $a$ and base $b$ powers together:

            $$a^{6-6} \cdot b^{-4 - (-12)} = a^0 \cdot b^{-4 + 12}$$
          - |
            **Simplify:** Since $a^0 = 1$:

            $$1 \cdot b^8 = b^8$$

    - id: 2
      titulo: "Producto negativo"
      dificultad: "Easy"
      tema: "Laws of Exponents"
      tiempo_minutos: 3
      enunciado: |
        Simplify the following product of exponential terms. Ensure all exponents in the final answer are positive:

        $$(x^{-3}y^4)^{-2} \cdot (x^2y^{-5})^{-3}$$

        <p class="highlight-text">Express the final result with positive exponents.</p>
      solucion:
        titulo_respuesta: |
          $$y^7$$
        pasos:
          - |
            **Apply power of a product rule:** Distribute outer exponents across terms:

            $$(x^{6}y^{-8}) \cdot (x^{-6}y^{15})$$
          - |
            **Apply product rule $x^m \cdot x^n = x^{m+n}$:** Combine powers of identical bases:

            $$x^{6 + (-6)} \cdot y^{-8 + 15} = x^0 y^7$$
          - |
            **Simplify:** Since $x^0 = 1$:

            $$y^7$$

    - id: 3
      titulo: "Monomios anidados"
      dificultad: "Easy"
      tema: "Laws of Exponents"
      tiempo_minutos: 3
      enunciado: |
        Simplify the expression and express the final answer using positive exponents only:

        $$\frac{(m^3n^{-2})^{-3}}{(m^{-4}n^3)^{-2}}$$

        <p class="highlight-text">Write the result as a fraction with positive exponents.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{n^{12}}{m^{17}}$$
        pasos:
          - |
            **Apply power of a power rule:** Multiply inside exponents by outer exponents:

            $$\frac{m^{-9}n^6}{m^8n^{-6}}$$
          - |
            **Apply quotient rule:** Subtract bottom exponents from top exponents for each base:

            $$m^{-9 - 8} \cdot n^{6 - (-6)} = m^{-17}n^{12}$$
          - |
            **Convert negative exponents:** Use $x^{-n} = \frac{1}{x^n}$:

            $$\frac{n^{12}}{m^{17}}$$

    - id: 4
      titulo: "Cociente negativo"
      dificultad: "Easy"
      tema: "Laws of Exponents"
      tiempo_minutos: 3
      enunciado: |
        Simplify the algebraic fraction completely:

        $$\frac{(p^{-2}q^3)^3}{(p^4q^{-1})^{-2}}$$

        <p class="highlight-text">Express the final answer in its simplest form with positive exponents.</p>
      solucion:
        titulo_respuesta: |
          $$p^2 q^7$$
        pasos:
          - |
            **Expand powers in numerator and denominator:** Multiply inner exponents by outer powers:

            $$\frac{p^{-6}q^9}{p^{-8}q^2}$$
          - |
            **Apply quotient rule:** Combine exponents for each variable base:

            $$p^{-6 - (-8)} \cdot q^{9 - 2} = p^{-6 + 8} \cdot q^7$$
          - |
            **Simplify:**

            $$p^2 q^7$$

    # MEDIUM (5-8)
    - id: 5
      titulo: "Combinación de reglas"
      dificultad: "Medium"
      tema: "Laws of Exponents"
      tiempo_minutos: 4
      enunciado: |
        Simplify the following algebraic expression completely:

        $$\frac{(x^{-3}y^4)^{-2}}{(x^2y^{-3})^3}$$

        <p class="highlight-text">Write your final answer with positive exponents only.</p>
      solucion:
        titulo_respuesta: |
          $$y$$
        pasos:
          - |
            **Distribute exponents:** Multiply power coefficients in numerator and denominator:

            $$\frac{x^6 y^{-8}}{x^6 y^{-9}}$$
          - |
            **Simplify base $x$ and base $y$ separately:**

            $$x^{6-6} \cdot y^{-8 - (-9)} = x^0 y^1$$
          - |
            **Final reduction:**

            $$y$$

    - id: 6
      titulo: "Exponentes multivariable"
      dificultad: "Medium"
      tema: "Laws of Exponents"
      tiempo_minutos: 4
      enunciado: |
        Simplify the quotient of exponential expressions completely:

        $$\frac{(a^{-2}b^3)^{-3}}{(a^4b^{-1})^{-2}}$$

        <p class="highlight-text">Express the answer as a fraction with positive exponents.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{a^{14}}{b^{11}}$$
        pasos:
          - |
            **Apply power of a power rule:**

            $$\frac{a^6 b^{-9}}{a^{-8} b^2}$$
          - |
            **Apply quotient rule:**

            $$a^{6 - (-8)} \cdot b^{-9 - 2} = a^{14} b^{-11}$$
          - |
            **Write with positive exponents:**

            $$\frac{a^{14}}{b^{11}}$$

    - id: 7
      titulo: "Exponentes fraccionarios"
      dificultad: "Medium"
      tema: "Laws of Exponents"
      tiempo_minutos: 4
      enunciado: |
        Simplify the expression involving fractional powers fully:

        $$\frac{(m^{-4}n^6)^{\frac{1}{2}}}{(m^2n^{-3})^{-2}}$$

        <p class="highlight-text">Express the final answer with positive exponents.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{m^2}{n^3}$$
        pasos:
          - |
            **Distribute outer exponents:** Multiply fractional and negative exponents:

            Numerator: $m^{-4 \cdot \frac{1}{2}} n^{6 \cdot \frac{1}{2}} = m^{-2} n^3$.

            Denominator: $m^{2(-2)} n^{-3(-2)} = m^{-4} n^6$.
          - |
            **Form unified fraction and apply quotient rule:**

            $$\frac{m^{-2} n^3}{m^{-4} n^6} = m^{-2 - (-4)} n^{3 - 6} = m^2 n^{-3}$$
          - |
            **Express with positive exponents:**

            $$\frac{m^2}{n^3}$$

    - id: 8
      titulo: "Bases numéricas"
      dificultad: "Medium"
      tema: "Laws of Exponents"
      tiempo_minutos: 4
      enunciado: |
        Simplify the expression containing prime numerical bases and fractional exponents:

        $$\frac{(16x^{-8}y^{12})^{-\frac{1}{4}}}{(27x^6y^{-9})^{\frac{1}{3}}}$$

        <p class="highlight-text">Express the final answer with positive exponents.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{1}{6}$$
        pasos:
          - |
            **Convert integer coefficients to prime powers:** Rewrite $16 = 2^4$ and $27 = 3^3$:

            $$\frac{((2^4)x^{-8}y^{12})^{-\frac{1}{4}}}{((3^3)x^6y^{-9})^{\frac{1}{3}}}$$
          - |
            **Distribute rational exponents:**

            Numerator: $2^{-1} x^2 y^{-3} = \frac{x^2}{2y^3}$.

            Denominator: $3^1 x^2 y^{-3} = 3x^2 y^{-3}$.
          - |
            **Simplify numerator over denominator:**

            $$\frac{2^{-1} x^2 y^{-3}}{3^1 x^2 y^{-3}} = \frac{2^{-1}}{3} \cdot \frac{x^2}{x^2} \cdot \frac{y^{-3}}{y^{-3}} = \frac{1}{2 \cdot 3} \cdot 1 \cdot 1 = \frac{1}{6}$$

    # HARD (9-12)
    - id: 9
      titulo: "Productos fraccionarios"
      dificultad: "Hard"
      tema: "Laws of Exponents"
      tiempo_minutos: 5
      enunciado: |
        Simplify the product of algebraic expressions involving rational exponents completely:

        $$\left( \frac{a^{-2} b^{\frac{3}{2}}}{a^3 b^{-\frac{1}{2}}} \right)^{-2} \cdot \left( \frac{a^4 b^{-3}}{a^{-1} b} \right)^{\frac{1}{2}}$$

        <p class="highlight-text">Express the final answer using positive exponents and simplify fractional powers into radical form where applicable.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{a^{12}\sqrt{a}}{b^6}$$
        pasos:
          - |
            **Simplify inside the first factor:**

            $$\frac{a^{-2}b^{\frac{3}{2}}}{a^3b^{-\frac{1}{2}}} = a^{-2-3}b^{\frac{3}{2}-(-\frac{1}{2})} = a^{-5}b^2$$

            Applying outer power $-2$: $(a^{-5}b^2)^{-2} = a^{10}b^{-4}$.
          - |
            **Simplify inside the second factor:**

            $$\frac{a^4b^{-3}}{a^{-1}b} = a^{4-(-1)}b^{-3-1} = a^5b^{-4}$$

            Applying outer power $\frac{1}{2}$: $(a^5b^{-4})^{\frac{1}{2}} = a^{\frac{5}{2}}b^{-2}$.
          - |
            **Multiply both simplified factors:**

            $$(a^{10}b^{-4}) \cdot (a^{\frac{5}{2}}b^{-2}) = a^{10 + \frac{5}{2}} b^{-4 - 2} = a^{\frac{25}{2}}b^{-6}$$
          - |
            **Convert rational exponent to radical form:** Since $\frac{25}{2} = 12 + \frac{1}{2}$:

            $$\frac{a^{12}\sqrt{a}}{b^6}$$

    - id: 10
      titulo: "Potencias numéricas"
      dificultad: "Hard"
      tema: "Laws of Exponents"
      tiempo_minutos: 5
      enunciado: |
        Simplify the expression fully, reducing numerical coefficients to simplest form:

        $$\frac{(8x^{-9}y^6)^{-\frac{2}{3}}}{(16x^4y^{-8})^{\frac{3}{4}}}$$

        <p class="highlight-text">Write your answer using positive exponents only.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{x^3 y^2}{32}$$
        pasos:
          - |
            **Express bases as prime powers:** $8 = 2^3$ and $16 = 2^4$:

            $$\frac{((2^3)x^{-9}y^6)^{-\frac{2}{3}}}{((2^4)x^4y^{-8})^{\frac{3}{4}}}$$
          - |
            **Apply outer fractional exponents:**

            Numerator: $2^{-2} x^6 y^{-4} = \frac{x^6}{4y^4}$.

            Denominator: $2^3 x^3 y^{-6} = 8x^3y^{-6}$.
          - |
            **Combine coefficients and exponents:**

            $$\frac{2^{-2}x^6y^{-4}}{2^3x^3y^{-6}} = 2^{-2-3} x^{6-3} y^{-4-(-6)} = 2^{-5} x^3 y^2 = \frac{x^3 y^2}{32}$$

    - id: 11
      titulo: "Potencia anidada"
      dificultad: "Hard"
      tema: "Laws of Exponents"
      tiempo_minutos: 5
      enunciado: |
        Simplify the nested power expression completely:

        $$\left[ \frac{(p^{-2} q^3)^{-2} \cdot (p^4 q^{-3})^2}{(p^{-3} q^4)^{-1}} \right]^{-\frac{1}{2}}$$

        <p class="highlight-text">Express the final result with positive exponents and simplified radicals if necessary.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{q^4}{p^4 \sqrt{p}}$$
        pasos:
          - |
            **Simplify the numerator inside brackets:**

            $$(p^4 q^{-6}) \cdot (p^8 q^{-6}) = p^{12} q^{-12}$$
          - |
            **Simplify the denominator inside brackets:**

            $$(p^{-3} q^4)^{-1} = p^3 q^{-4}$$
          - |
            **Combine terms inside brackets:**

            $$\frac{p^{12} q^{-12}}{p^3 q^{-4}} = p^{12-3} q^{-12-(-4)} = p^9 q^{-8}$$
          - |
            **Apply the outer exponent $-\frac{1}{2}$:**

            $$(p^9 q^{-8})^{-\frac{1}{2}} = p^{-\frac{9}{2}} q^4 = \frac{q^4}{p^{\frac{9}{2}}} = \frac{q^4}{p^4 \sqrt{p}}$$

    - id: 12
      titulo: "Cociente con bases primas"
      dificultad: "Hard"
      tema: "Laws of Exponents"
      tiempo_minutos: 5
      enunciado: |
        Simplify the multi-term algebraic expression fully:

        $$\frac{(32a^{-10}b^{15})^{-\frac{2}{5}} \cdot (81a^{-8}b^{12})^{\frac{1}{4}}}{(16a^{-4}b^8)^{\frac{1}{2}}}$$

        <p class="highlight-text">Express the answer as a simplified rational expression with positive exponents.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{3a^4}{16b^7}$$
        pasos:
          - |
            **Express constants as prime powers ($32 = 2^5, 81 = 3^4, 16 = 2^4$):**

            $$\frac{((2^5)a^{-10}b^{15})^{-\frac{2}{5}} \cdot ((3^4)a^{-8}b^{12})^{\frac{1}{4}}}{((2^4)a^{-4}b^8)^{\frac{1}{2}}}$$
          - |
            **Evaluate individual factors:**

            First factor: $2^{-2} a^4 b^{-6}$.

            Second factor: $3^1 a^{-2} b^3$.

            Denominator factor: $2^2 a^{-2} b^4$.
          - |
            **Multiply numerator factors:**

            $$(2^{-2} \cdot 3^1) \cdot a^{4 + (-2)} \cdot b^{-6 + 3} = \frac{3}{4} a^2 b^{-3}$$
          - |
            **Divide by denominator:**

            $$\frac{\frac{3}{4} a^2 b^{-3}}{4 a^{-2} b^4} = \frac{3}{16} a^{2 - (-2)} b^{-3 - 4} = \frac{3}{16} a^4 b^{-7} = \frac{3a^4}{16b^7}$$
