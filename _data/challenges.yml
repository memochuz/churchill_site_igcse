      tema: "Simplification of Surds"
      tiempo_minutos: 3
      enunciado: |
        Simplify the cube root expression completely:

        $$\sqrt[3]{54 a^7 b^{11}}$$

        <p class="highlight-text">Express your final answer in simplest radical form.</p>
      solucion:
        titulo_respuesta: |
          $$3a^2 b^3 \sqrt[3]{2a b^2}$$
        pasos:
          - |
            **Factorize into prime factors and variables:** Express $54$, $a^7$, and $b^{11}$ in full prime and variable factors:

            $$\sqrt[3]{(2 \cdot 3 \cdot 3 \cdot 3) \cdot (a \cdot a \cdot a \cdot a \cdot a \cdot a \cdot a) \cdot (b \cdot b \cdot b \cdot b \cdot b \cdot b \cdot b \cdot b \cdot b \cdot b \cdot b)}$$
          - |
            **Group depending on the index ($n = 3$):** Form explicit groups of 3 for each base:

            $$\sqrt[3]{(3^3 \cdot 2) \cdot (a^3 \cdot a^3 \cdot a) \cdot (b^3 \cdot b^3 \cdot b^3 \cdot b^2)}$$
          - |
            **Extract and multiply:** Move one base out for each group of 3 ($3, a, a, b, b, b$) and multiply:

            $$(3 \cdot a \cdot a \cdot b \cdot b \cdot b)\sqrt[3]{2 \cdot a \cdot b^2} = 3a^2 b^3 \sqrt[3]{2a b^2}$$

    - id: 3
      titulo: "Raíz cuarta de monomio"
