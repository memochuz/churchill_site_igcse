- id: "simplification_of_surds"
  titulo_evaluacion: "Simplification of Surds Challenges"
  topic: "Simplification of Surds"
  description: "Comprehensive problem set on simplifying radicals, extracting prime factors, radical operations, and geometric applications."
  preguntas:
    # EASY (1-4)
    - id: 1
      titulo: "Raíz cuadrada de monomio"
      dificultad: "Easy"
      tema: "Simplification of Surds"
      tiempo_minutos: 3
      enunciado: |
        Simplify the square root expression completely by extracting all possible numerical and variable factors:

        $$\sqrt{72 x^5 y^8}$$

        <p class="highlight-text">Express the final answer in its most simplified radical form.</p>
      solucion:
        titulo_respuesta: |
          $$6x^2 y^4 \sqrt{2x}$$
        pasos:
          - |
            **Factorize into prime factors and variables:** Break down $72$, $x^5$, and $y^8$ into base primes and individual variable terms:

            $$\sqrt{(2 \cdot 2 \cdot 2 \cdot 3 \cdot 3) \cdot (x \cdot x \cdot x \cdot x \cdot x) \cdot (y \cdot y \cdot y \cdot y \cdot y \cdot y \cdot y \cdot y)}$$
          - |
            **Group depending on the index ($n = 2$):** Group terms into explicit pairs (groups of 2):

            $$\sqrt{(2^2 \cdot 3^2 \cdot 2) \cdot (x^2 \cdot x^2 \cdot x) \cdot (y^2 \cdot y^2 \cdot y^2 \cdot y^2)}$$
          - |
            **Extract and multiply:** Pull out one term for each complete group of $2$ ($2, 3, x, x, y, y, y, y$) and multiply them outside:

            $$(2 \cdot 3 \cdot x \cdot x \cdot y \cdot y \cdot y \cdot y)\sqrt{2 \cdot x} = 6x^2 y^4 \sqrt{2x}$$

    - id: 2
      titulo: "Raíz cúbica de monomio"
