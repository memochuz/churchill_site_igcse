          - |
            **Substitute back into the main fraction:**

            $$\frac{x^{-8}y^{12}}{x^4y^{-2}} = x^{-8-4} y^{12-(-2)} = x^{-12}y^{14}$$
          - |
            **Apply the outer fourth root:**

            $$\sqrt[4]{x^{-12}y^{14}} = (x^{-12}y^{14})^{\frac{1}{4}} = x^{-3} y^{\frac{14}{4}} = x^{-3} y^{\frac{7}{2}}$$
          - |
