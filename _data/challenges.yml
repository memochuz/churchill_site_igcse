      enunciado: |
        Simplify the radical expression completely:

        $$\sqrt{\frac{x^{-4} y^8}{16}}$$

        <p class="highlight-text">Express the final answer with positive exponents.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{y^4}{4x^2}$$
        pasos:
          - |
            **Apply quotient property of radicals $\sqrt{\frac{A}{B}} = \frac{\sqrt{A}}{\sqrt{B}}$:**

            $$\frac{\sqrt{x^{-4}y^8}}{\sqrt{16}}$$
          - |
            **Convert radicals to fractional exponents:**

            $$\frac{(x^{-4}y^8)^{\frac{1}{2}}}{4} = \frac{x^{-2}y^4}{4}$$
          - |
            **Write with positive exponents:**

            $$\frac{y^4}{4x^2}$$

    - id: 2
      titulo: "Cociente de radicales"
      dificultad: "Easy"
      tema: "Laws of Radicals"
      tiempo_minutos: 3
      enunciado: |
        Simplify the radical expression:

        $$\sqrt{\frac{x^{-6}y^4}{x^2y^{-4}}}$$

        <p class="highlight-text">Express the result as a single algebraic fraction without radicals.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{y^4}{x^4}$$
        pasos:
          - |
            **Simplify inside the radical first:**

            $$\frac{x^{-6}y^4}{x^2y^{-4}} = x^{-6-2} y^{4-(-4)} = x^{-8} y^8$$
          - |
            **Apply the square root:**

            $$\sqrt{x^{-8} y^8} = (x^{-8} y^8)^{\frac{1}{2}} = x^{-4} y^4$$
          - |
            **Express with positive exponents:**

            $$\frac{y^4}{x^4}$$

    - id: 3
      titulo: "Raíz cúbica"
      dificultad: "Easy"
      tema: "Laws of Radicals"
      tiempo_minutos: 3
      enunciado: |
        Simplify the cube root expression completely:

        $$\sqrt[3]{27x^{-6}y^9}$$

        <p class="highlight-text">Express the final answer using positive exponents.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{3y^3}{x^2}$$
        pasos:
          - |
            **Separate into individual factors:**

            $$\sqrt[3]{27} \cdot \sqrt[3]{x^{-6}} \cdot \sqrt[3]{y^9}$$
          - |
            **Evaluate each radical:** $\sqrt[3]{27} = 3$, $\sqrt[3]{x^{-6}} = x^{-2}$, and $\sqrt[3]{y^9} = y^3$.
          - |
            **Combine terms:**

            $$3x^{-2}y^3 = \frac{3y^3}{x^2}$$

    - id: 4
      titulo: "Fracción radical"
      dificultad: "Easy"
      tema: "Laws of Radicals"
      tiempo_minutos: 3
      enunciado: |
        Simplify the radical fraction fully:

        $$\sqrt{\frac{25a^{-4}b^6}{c^{-2}}}$$

        <p class="highlight-text">Express the final answer with positive exponents.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{5b^3c}{a^2}$$
        pasos:
          - |
            **Rewrite negative exponent in denominator to numerator:**

            $$\sqrt{25a^{-4}b^6c^2}$$
          - |
            **Take the square root of each term:**

            $$\sqrt{25} \cdot \sqrt{a^{-4}} \cdot \sqrt{b^6} \cdot \sqrt{c^2} = 5 a^{-2} b^3 c$$
          - |
            **Express with positive exponents:**

            $$\frac{5b^3c}{a^2}$$

    # MEDIUM (5-8)
    - id: 5
      titulo: "Raíces anidadas"
      dificultad: "Medium"
      tema: "Laws of Radicals"
      tiempo_minutos: 4
      enunciado: |
        Simplify the nested radical expression:

        $$\sqrt[4]{\frac{x^{-8}y^{12}}{\sqrt{x^8y^{-4}}}}$$

        <p class="highlight-text">Express the result with positive exponents and simplified radicals.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{y^3\sqrt{y}}{x^3}$$
        pasos:
          - |
            **Simplify the inner radical:**

            $$\sqrt{x^8y^{-4}} = (x^8y^{-4})^{\frac{1}{2}} = x^4y^{-2}$$
          - |
            **Substitute back into the main fraction:**

            $$\frac{x^{-8}y^{12}}{x^4y^{-2}} = x^{-8-4} y^{12-(-2)} = x^{-12}y^{14}$$
          - |
            **Apply the outer fourth root:**

            $$\sqrt[4]{x^{-12}y^{14}} = (x^{-12}y^{14})^{\frac{1}{4}} = x^{-3} y^{\frac{14}{4}} = x^{-3} y^{\frac{7}{2}}$$
          - |
            **Convert to radical form:** Since $y^{\frac{7}{2}} = y^3 \cdot y^{\frac{1}{2}} = y^3\sqrt{y}$:

            $$\frac{y^3\sqrt{y}}{x^3}$$

    - id: 6
      titulo: "Índice mixto anidado"
      dificultad: "Medium"
      tema: "Laws of Radicals"
      tiempo_minutos: 4
      enunciado: |
        Simplify the nested radical structure:

        $$\sqrt[3]{\frac{\sqrt{x^{-12}y^{18}}}{\sqrt[3]{x^9y^{-6}}}}$$

        <p class="highlight-text">Express the final answer in terms of simplified radical notation.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{y^3\sqrt[3]{y^2}}{x^3}$$
        pasos:
          - |
            **Simplify numerator and denominator radicals separately:**

            Numerator: $\sqrt{x^{-12}y^{18}} = x^{-6}y^9$.

            Denominator: $\sqrt[3]{x^9y^{-6}} = x^3y^{-2}$.
          - |
            **Simplify the internal fraction:**

            $$\frac{x^{-6}y^9}{x^3y^{-2}} = x^{-6-3} y^{9-(-2)} = x^{-9}y^{11}$$
          - |
            **Apply outer cube root:**

            $$\sqrt[3]{x^{-9}y^{11}} = (x^{-9}y^{11})^{\frac{1}{3}} = x^{-3} y^{\frac{11}{3}}$$
          - |
            **Separate whole power and radical remainder:** Since $\frac{11}{3} = 3 + \frac{2}{3}$:

            $$\frac{y^3\sqrt[3]{y^2}}{x^3}$$

    - id: 7
      titulo: "Raíces combinadas"
      dificultad: "Medium"
      tema: "Laws of Radicals"
      tiempo_minutos: 4
      enunciado: |
        Simplify the radical expression completely:

        $$\sqrt{\frac{\sqrt[3]{x^{-6}y^{12}}}{\sqrt[4]{x^8y^{-4}}}}$$

        <p class="highlight-text">Express the final answer using positive exponents and simplified radicals.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{y^2\sqrt{y}}{x^2}$$
        pasos:
          - |
            **Evaluate individual radicals in numerator and denominator:**

            Numerator: $\sqrt[3]{x^{-6}y^{12}} = x^{-2}y^4$.

            Denominator: $\sqrt[4]{x^8y^{-4}} = x^2y^{-1}$.
          - |
            **Simplify fraction inside outer square root:**

            $$\frac{x^{-2}y^4}{x^2y^{-1}} = x^{-2-2} y^{4-(-1)} = x^{-4}y^5$$
          - |
            **Apply outer square root:**

            $$\sqrt{x^{-4}y^5} = (x^{-4}y^5)^{\frac{1}{2}} = x^{-2} y^{\frac{5}{2}}$$
          - |
            **Convert fractional exponent to radical form:**

            $$\frac{y^2\sqrt{y}}{x^2}$$

    - id: 8
      titulo: "Mismo índice"
      dificultad: "Medium"
      tema: "Laws of Radicals"
      tiempo_minutos: 4
      enunciado: |
        Simplify the product of radicals:

        $$\sqrt[3]{x^{-4}y^5} \times \sqrt[3]{x^{-2}y^4}$$

        <p class="highlight-text">Express the final answer with positive exponents.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{y^3}{x^2}$$
        pasos:
          - |
            **Combine under a single radical using $\sqrt[n]{A} \cdot \sqrt[n]{B} = \sqrt[n]{A \cdot B}$:**

            $$\sqrt[3]{(x^{-4}y^5)(x^{-2}y^4)} = \sqrt[3]{x^{-4+(-2)} y^{5+4}} = \sqrt[3]{x^{-6}y^9}$$
          - |
            **Evaluate the cube root:**

            $$x^{-\frac{6}{3}} y^{\frac{9}{3}} = x^{-2} y^3$$
          - |
            **Write with positive exponents:**

            $$\frac{y^3}{x^2}$$

    # HARD (9-12)
    - id: 9
      titulo: "Diferente índice"
      dificultad: "Hard"
      tema: "Laws of Radicals"
      tiempo_minutos: 5
      enunciado: |
        Multiply and simplify the radicals with different indices:

        $$\sqrt[3]{x^{-2}y^4} \times \sqrt[4]{x^{-3}y^5}$$

        <p class="highlight-text">Express the final result in simplified radical form using a single root index.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{y^2 \sqrt[12]{y^7}}{x \sqrt[12]{x^5}}$$
        pasos:
          - |
            **Convert radicals to rational exponents:**

            $$(x^{-2}y^4)^{\frac{1}{3}} \cdot (x^{-3}y^5)^{\frac{1}{4}} = x^{-\frac{2}{3}} y^{\frac{4}{3}} \cdot x^{-\frac{3}{4}} y^{\frac{5}{4}}$$
          - |
            **Find a common denominator for exponents ($\text{LCM}(3,4) = 12$):**

            Base $x$: $-\frac{2}{3} - \frac{3}{4} = -\frac{8}{12} - \frac{9}{12} = -\frac{17}{12}$.

            Base $y$: $\frac{4}{3} + \frac{5}{4} = \frac{16}{12} + \frac{15}{12} = \frac{31}{12}$.
          - |
            **Rewrite term as fractional expression:**

            $$x^{-\frac{17}{12}} y^{\frac{31}{12}} = \frac{y^{\frac{31}{12}}}{x^{\frac{17}{12}}}$$
          - |
            **Decompose fractional powers into whole and radical parts:**

            Numerator: $y^{\frac{31}{12}} = y^{2 + \frac{7}{12}} = y^2 \sqrt[12]{y^7}$.

            Denominator: $x^{\frac{17}{12}} = x^{1 + \frac{5}{12}} = x \sqrt[12]{x^5}$.

            Final expression:

            $$\frac{y^2 \sqrt[12]{y^7}}{x \sqrt[12]{x^5}}$$

    - id: 10
      titulo: "Cociente anidado"
      dificultad: "Hard"
      tema: "Laws of Radicals"
      tiempo_minutos: 5
      enunciado: |
        Simplify the multi-level radical quotient completely:

        $$\sqrt{\frac{x^{-3} \sqrt[4]{y^6}}{y^{-1} \sqrt[3]{x^3}}}$$

        <p class="highlight-text">Express the final answer in terms of simplified radicals with positive exponents.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{y\sqrt[4]{y}}{x^2}$$
        pasos:
          - |
            **Simplify inner terms:**

            $\sqrt[4]{y^6} = y^{\frac{6}{4}} = y^{\frac{3}{2}}$.

            $\sqrt[3]{x^3} = x^1 = x$.
          - |
            **Substitute back into quotient:**

            $$\frac{x^{-3} y^{\frac{3}{2}}}{y^{-1} x} = x^{-3-1} y^{\frac{3}{2}-(-1)} = x^{-4} y^{\frac{5}{2}}$$
          - |
            **Apply outer square root:**

            $$\sqrt{x^{-4} y^{\frac{5}{2}}} = (x^{-4} y^{\frac{5}{2}})^{\frac{1}{2}} = x^{-2} y^{\frac{5}{4}}$$
          - |
            **Convert to radical notation:** Since $y^{\frac{5}{4}} = y^{1 + \frac{1}{4}} = y\sqrt[4]{y}$:

            $$\frac{y\sqrt[4]{y}}{x^2}$$

    - id: 11
      titulo: "División radical"
      dificultad: "Hard"
      tema: "Laws of Radicals"
      tiempo_minutos: 5
      enunciado: |
        Perform the operation and simplify completely:

        $$\sqrt[4]{\frac{16a^{-8}b^{12}}{c^{-4}}} \div \left( \frac{a^2 c^{-1}}{b^3} \right)^{-\frac{1}{2}}$$

        <p class="highlight-text">Express the final answer in simplified radical form.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{2b\sqrt{bc}}{a}$$
        pasos:
          - |
            **Simplify the first radical term:**

            $$\sqrt[4]{\frac{16b^{12}c^4}{a^8}} = \frac{\sqrt[4]{16} \cdot \sqrt[4]{b^{12}} \cdot \sqrt[4]{c^4}}{\sqrt[4]{a^8}} = \frac{2 b^3 c}{a^2}$$
          - |
            **Simplify the second term:**

            $$\left( \frac{a^2 c^{-1}}{b^3} \right)^{-\frac{1}{2}} = \left( \frac{b^3}{a^2 c^{-1}} \right)^{\frac{1}{2}} = \frac{b^{\frac{3}{2}}}{a c^{-\frac{1}{2}}} = \frac{b^{\frac{3}{2}} c^{\frac{1}{2}}}{a}$$
          - |
            **Perform division:**

            $$\frac{2b^3c}{a^2} \div \frac{b^{\frac{3}{2}}c^{\frac{1}{2}}}{a} = \frac{2b^3c}{a^2} \cdot \frac{a}{b^{\frac{3}{2}}c^{\frac{1}{2}}} = \frac{2 b^{3 - \frac{3}{2}} c^{1 - \frac{1}{2}}}{a^{2-1}}$$
          - |
            **Simplify exponents and convert to radical form:**

            $$\frac{2 b^{\frac{3}{2}} c^{\frac{1}{2}}}{a} = \frac{2 b \cdot b^{\frac{1}{2}} c^{\frac{1}{2}}}{a} = \frac{2b\sqrt{bc}}{a}$$

    - id: 12
      titulo: "Triple raíz"
      dificultad: "Hard"
      tema: "Laws of Radicals"
      tiempo_minutos: 5
      enunciado: |
        Simplify the nested radical expression completely:

        $$\sqrt{x^{-2} \sqrt[3]{x^4 y^{-6} \sqrt{x^4 y^8}}}$$

        <p class="highlight-text">Express the final answer with simplified radicals.</p>
      solucion:
        titulo_respuesta: |
          $$\frac{1}{\sqrt[3]{y}}$$
        pasos:
          - |
            **Simplify the innermost square root:**

            $$\sqrt{x^4y^8} = x^2y^4$$
          - |
            **Substitute into the middle radical and simplify:**

            $$\sqrt[3]{x^4y^{-6} \cdot (x^2y^4)} = \sqrt[3]{x^{4+2} y^{-6+4}} = \sqrt[3]{x^6y^{-2}} = x^2 y^{-\frac{2}{3}}$$
          - |
            **Substitute into the outer square root:**

            $$\sqrt{x^{-2} \cdot (x^2 y^{-\frac{2}{3}})} = \sqrt{x^{-2+2} y^{-\frac{2}{3}}} = \sqrt{x^0 y^{-\frac{2}{3}}} = \sqrt{y^{-\frac{2}{3}}}$$
          - |
            **Evaluate final power:**

            $$(y^{-\frac{2}{3}})^{\frac{1}{2}} = y^{-\frac{1}{3}} = \frac{1}{\sqrt[3]{y}}$$