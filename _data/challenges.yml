          - |
            **Simplify inside the radical first:**

            $$\frac{x^{-6}y^4}{x^2y^{-4}} = x^{-6-2} y^{4-(-4)} = x^{-8} y^8$$
          - |
            **Apply the square root:**

            $$\sqrt{x^{-8} y^8} = (x^{-8} y^8)^{\frac{1}{2}} = x^{-4} y^4$$
          - |
            **Express with positive exponents:**

