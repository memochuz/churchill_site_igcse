# Projects Settings
projects_settings:
  enable: true
  projects_title: Class notes
  projects_description: |
    This section is designed to complement your in-class learning and provide a strong foundation for your IGCSE studies. Think of it as a guide or a starting point for each topic.

    However, <b>these notes are not a substitute for taking your own detailed notes during class</b>. Writing your own notes is essential for a deeper understanding and for truly absorbing the material in a way that makes sense to you.


