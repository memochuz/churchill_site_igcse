questions:
  - question: 'If we have a strict inequality, the induced line will be: a dotted line or a solid line?'
    solution: 'Dotted line'
  - question: 'The line $y=4$, is it horizontal or vertical?'
    solution: 'Horizontal'
  - question: 'The line $x=2$, is it horizontal or vertical?'
    solution: 'Vertical'
