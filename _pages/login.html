---
layout: default
title: 🔒 Iniciar Sesión
permalink: /login/
---

<article class="page container">
  <div class="page-head">
    <h1 class="page-title">{{ page.title }}</h1>
    <div class="page-description">
      Ingresa tus credenciales para acceder a los recursos del curso.
    </div>
  </div>

  <section class="exams-section" style="max-width: 480px; margin: 0 auto;">
    <div class="exam-block" style="padding: 1.5rem;">
      <form id="login-form" style="display: flex; flex-direction: column; gap: 1rem;">
        <div>
          <label for="email" style="display: block; margin-bottom: 0.3rem; font-weight: bold;">Correo electrónico</label>
          <input type="email" id="email" required placeholder="tu@correo.com" 
                 style="width: 100%; padding: 0.6rem; border-radius: 4px; border: 1px solid #ccc;">
        </div>

        <div>
          <label for="password" style="display: block; margin-bottom: 0.3rem; font-weight: bold;">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••" 
                 style="width: 100%; padding: 0.6rem; border-radius: 4px; border: 1px solid #ccc;">
        </div>

        <button type="submit" class="exam-main-btn" style="cursor: pointer; font-size: 1rem; width: 100%;">
          Entrar
        </button>
      </form>

      <div id="error-message" style="color: #e74c3c; margin-top: 1rem; text-align: center; font-weight: bold;"></div>
    </div>
  </section>
</article>

{% include firebase-init.html %}

<script type="module">
  import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

  const form = document.getElementById('login-form');
  const errorMessage = document.getElementById('error-message');

  // Si ya inició sesión previamente, redirigir automáticamente
  onAuthStateChanged(window.auth, (user) => {
    if (user) {
      const redirectTo = sessionStorage.getItem('redirect_after_login') || "{{ '/' | relative_url }}";
      sessionStorage.removeItem('redirect_after_login');
      window.location.href = redirectTo;
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMessage.textContent = '';
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      await signInWithEmailAndPassword(window.auth, email, password);
      const redirectTo = sessionStorage.getItem('redirect_after_login') || "{{ '/' | relative_url }}";
      sessionStorage.removeItem('redirect_after_login');
      window.location.href = redirectTo;
    } catch (error) {
      errorMessage.textContent = 'Credenciales inválidas o error de conexión.';
      console.error(error);
    }
  });
</script>
